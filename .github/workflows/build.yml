name: Build

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/*.yml'
      - '.github/actions/pullrequest.yml'
      - '.idea/copyright/*.xml'
      - '.gitignore'
      - 'LICENSE'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: hydraulic-build-${{ github.ref }}
  cancel-in-progress: true

env:
  PACK_CONVERTER_REPO: nguyenphuck2468-tech/PackConverter
  # Keep Hydraulic artifacts reproducible. Update this SHA deliberately after
  # validating a new PackConverter integration revision.
  PACK_CONVERTER_REF: e454a145e782bf742f0c7a18f84e36597a75fbc3

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Hydraulic source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Gradle and Java
        uses: GeyserMC/actions/setup-gradle-composite@e4d4a9d33249b7303094470d4a1e49a6fa6643d4
        with:
          setup-java_java-version: 25

      - name: Checkout PackConverter integration source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ env.PACK_CONVERTER_REPO }}
          ref: ${{ env.PACK_CONVERTER_REF }}
          path: PackConverter
          persist-credentials: false

      - name: Verify PackConverter checkout
        working-directory: PackConverter
        run: |
          test -f settings.gradle.kts
          test -f converter/build.gradle.kts
          test "$(git rev-parse HEAD)" = "$PACK_CONVERTER_REF"
          git status --short

      - name: Test PackConverter integration source
        working-directory: PackConverter
        run: gradle :converter:test --no-daemon --stacktrace --warning-mode all

      - name: Publish PackConverter modules to local Maven
        working-directory: PackConverter
        run: |
          gradle :pack-schema-api:publishToMavenLocal :converter:publishToMavenLocal --no-daemon --stacktrace --warning-mode all

      - name: Verify PackConverter publication
        shell: bash
        run: |
          set -euo pipefail
          test -d "$HOME/.m2/repository/org/geysermc/pack/converter/3.5.8-SNAPSHOT"
          test -f "$HOME/.m2/repository/org/geysermc/pack/converter/3.5.8-SNAPSHOT/converter-3.5.8-SNAPSHOT.pom"

      - name: Build Hydraulic
        run: ./gradlew build --no-daemon --stacktrace --warning-mode all

      - name: Archive Artifacts
        uses: GeyserMC/actions/upload-multi-artifact@e4d4a9d33249b7303094470d4a1e49a6fa6643d4
        if: success()
        with:
          artifacts: |
            fabric/build/libs/hydraulic-fabric.jar
            neoforge/build/libs/hydraulic-neoforge.jar

      - name: Get Version
        if: ${{ success() && github.repository == 'GeyserMC/Hydraulic' && github.ref_name == 'master' }}
        id: get-version
        run: |
          version=$(cat gradle.properties | grep -o "^version=[0-9\\.]*" | cut -d"=" -f2)
          echo "VERSION=${version}" >> $GITHUB_OUTPUT

      - name: Get Release Metadata
        if: ${{ success() && github.repository == 'GeyserMC/Hydraulic' && github.ref_name == 'master' }}
        id: metadata
        uses: GeyserMC/actions/release@e4d4a9d33249b7303094470d4a1e49a6fa6643d4
        with:
          appID: ${{ secrets.RELEASE_APP_ID }}
          appPrivateKey: ${{ secrets.RELEASE_APP_PK }}
          files: |
            fabric:fabric/build/libs/hydraulic-fabric.jar
            neoforge:neoforge/build/libs/hydraulic-neoforge.jar
          releaseEnabled: false
          saveMetadata: true
          releaseProject: 'hydraulic'
          releaseVersion: ${{ steps.get-version.outputs.VERSION }}

      - name: Publish to Downloads API
        if: ${{ success() && github.repository == 'GeyserMC/Hydraulic' && github.ref_name == 'master' }}
        uses: GeyserMC/actions/upload-release@e4d4a9d33249b7303094470d4a1e49a6fa6643d4
        with:
          username: ${{ vars.DOWNLOADS_USERNAME }}
          privateKey: ${{ secrets.DOWNLOADS_PRIVATE_KEY }}
          host: ${{ secrets.DOWNLOADS_SERVER_IP }}
          files: |
            fabric/build/libs/hydraulic-fabric.jar
            neoforge/build/libs/hydraulic-neoforge.jar
          changelog: ${{ steps.metadata.outputs.body }}

      - name: Notify Discord
        if: ${{ (success() || failure()) && github.repository == 'GeyserMC/Hydraulic' }}
        uses: GeyserMC/actions/notify-discord@e4d4a9d33249b7303094470d4a1e49a6fa6643d4
        with:
          discordWebhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          body: ${{ steps.metadata.outputs.body }}
