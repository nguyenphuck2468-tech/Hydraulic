name: Build

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/*.yml'
      - '.github/actions/pullrequest.yml'
      - '.idea/copyright/*.xml'
      - '.gitignore'
      - 'LICENSE'
      - 'README.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Hydraulic
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout PackConverter fork
        uses: actions/checkout@v4
        with:
          repository: nguyenphuck2468-tech/PackConverter
          ref: 60e63c33a86651243303960bc3f616e6e93c3583
          path: ../PackConverter
          persist-credentials: false

      - name: Setup Gradle
        uses: GeyserMC/actions/setup-gradle-composite@master
        with:
          setup-java_java-version: 25

      - name: Build Hydraulic with PackConverter fork
        run: ./gradlew clean build --no-daemon -PpackConverterPath=../PackConverter

      - name: Archive Artifacts
        uses: GeyserMC/actions/upload-multi-artifact@master
        if: success()
        with:
          artifacts: |
            fabric/build/libs/hydraulic-fabric.jar

      - name: Get Version
        if: ${{ success() && github.repository == 'GeyserMC/Hydraulic' && github.ref_name == 'master' }}
        id: get-version
        run: |
          version=$(cat gradle.properties | grep -o "^version=[0-9\\.]*" | cut -d"=" -f2)
          echo "VERSION=${version}" >> $GITHUB_OUTPUT

      - name: Get Release Metadata
        if: ${{ success() && github.repository == 'GeyserMC/Hydraulic' && github.ref_name == 'master' }}
        id: metadata
        uses: GeyserMC/actions/release@master
        with:
          appID: ${{ secrets.RELEASE_APP_ID }}
          appPrivateKey: ${{ secrets.RELEASE_APP_PK }}
          files: |
            fabric:fabric/build/libs/hydraulic-fabric.jar
          releaseEnabled: false
          saveMetadata: true
          releaseProject: 'hydraulic'
          releaseVersion: ${{ steps.get-version.outputs.VERSION }}

      - name: Publish to Downloads API
        if: ${{ success() && github.repository == 'GeyserMC/Hydraulic' && github.ref_name == 'master' }}
        uses: GeyserMC/actions/upload-release@master
        with:
          username: ${{ vars.DOWNLOADS_USERNAME }}
          privateKey: ${{ secrets.DOWNLOADS_PRIVATE_KEY }}
          host: ${{ secrets.DOWNLOADS_SERVER_IP }}
          files: |
            fabric/build/libs/hydraulic-fabric.jar
          changelog: ${{ steps.metadata.outputs.body }}

      - name: Notify Discord
        if: ${{ (success() || failure()) && github.repository == 'GeyserMC/Hydraulic' }}
        uses: GeyserMC/actions/notify-discord@master
        with:
          discordWebhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          body: ${{ steps.metadata.outputs.body }}