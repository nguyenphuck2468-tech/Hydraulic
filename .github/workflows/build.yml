name: Build

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/*.yml'
      - '.github/actions/pullrequest.yml'
      - '.idea/copyright/*.xml'
      - '.gitignore'
      - 'LICENSE'
      - 'README.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Gradle
        uses: GeyserMC/actions/setup-gradle-composite@master
        with:
          setup-java_java-version: 25

      - name: Build Hydraulic
        run: ./gradlew build

      - name: Test Fabric 26.2 Server Startup
        timeout-minutes: 5
        run: |
          mkdir -p runtime-test
          printf 'eula=true\n' > eula.txt
          ./gradlew :fabric:runServer --no-daemon > runtime-test/server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT

          for i in $(seq 1 180); do
            if grep -q 'Done (' runtime-test/server.log; then
              echo 'Fabric 26.2 server started successfully.'
              exit 0
            fi
            if grep -Eiq '(^|[[:space:]])(Exception|Error|Could not load|Failed to start|Mixin.*failed)' runtime-test/server.log; then
              echo 'Fabric 26.2 server failed during startup.'
              cat runtime-test/server.log
              exit 1
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo 'Fabric server process exited before reaching Done.'
              cat runtime-test/server.log
              exit 1
            fi
            sleep 1
          done

          echo 'Timed out waiting for Fabric 26.2 server startup.'
          cat runtime-test/server.log
          exit 1

      - name: Archive Runtime Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-26.2-runtime-log
          path: runtime-test/server.log

      - name: Archive Artifacts
        uses: GeyserMC/actions/upload-multi-artifact@master
        if: success()
        with:
          artifacts: |
            fabric/build/libs/hydraulic-fabric.jar

      - name: Get Version
        if: ${{ success() && github.repository == 'GeyserMC/Hydraulic' && github.ref_name == 'master' }}
        id: get-version
        run: |
          version=$(cat gradle.properties | grep -o "^version=[0-9\\.]*" | cut -d"=" -f2)
          echo "VERSION=${version}" >> $GITHUB_OUTPUT

      - name: Get Release Metadata
        if: ${{ success() && github.repository == 'GeyserMC/Hydraulic' && github.ref_name == 'master' }}
        uses: GeyserMC/actions/release@master
        id: metadata
        with:
          appID: ${{ secrets.RELEASE_APP_ID }}
          appPrivateKey: ${{ secrets.RELEASE_APP_PK }}
          files: |
            fabric:fabric/build/libs/hydraulic-fabric.jar
          releaseEnabled: false
          saveMetadata: true
          releaseProject: 'hydraulic'
          releaseVersion: ${{ steps.get-version.outputs.VERSION }}

      - name: Publish to Downloads API
        if: ${{ success() && github.repository == 'GeyserMC/Hydraulic' && github.ref_name == 'master' }}
        uses: GeyserMC/actions/upload-release@master
        with:
          username: ${{ vars.DOWNLOADS_USERNAME }}
          privateKey: ${{ secrets.DOWNLOADS_PRIVATE_KEY }}
          host: ${{ secrets.DOWNLOADS_SERVER_IP }}
          files: |
            fabric/build/libs/hydraulic-fabric.jar
          changelog: ${{ steps.metadata.outputs.body }}

      - name: Notify Discord
        if: ${{ (success() || failure()) && github.repository == 'GeyserMC/Hydraulic' }}
        uses: GeyserMC/actions/notify-discord@master
        with:
          discordWebhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          body: ${{ steps.metadata.outputs.body }}