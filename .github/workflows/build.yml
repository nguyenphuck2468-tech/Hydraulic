name: Build

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/*.yml'
      - '.github/actions/pullrequest.yml'
      - '.idea/copyright/*.xml'
      - '.gitignore'
      - 'LICENSE'
      - 'README.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Gradle
        uses: GeyserMC/actions/setup-gradle-composite@master
        with:
          setup-java_java-version: 25

      - name: Prepare Geyser language resources
        shell: bash
        run: |
          set -euo pipefail

          rm -rf runtime-test-languages
          git clone --depth 1 https://github.com/GeyserMC/languages.git runtime-test-languages

          test -s runtime-test-languages/texts/en_US.properties

          mkdir -p fabric/src/main/resources/languages/texts
          cp runtime-test-languages/texts/*.properties fabric/src/main/resources/languages/texts/

          echo "Installed $(find fabric/src/main/resources/languages/texts -name '*.properties' | wc -l) Geyser locale files."
          test -s fabric/src/main/resources/languages/texts/en_US.properties

      - name: Build Hydraulic
        run: ./gradlew build

      - name: Verify bundled Geyser language resources
        shell: bash
        run: |
          set -euo pipefail
          jar_file=fabric/build/libs/hydraulic-fabric.jar

          test -s fabric/build/resources/main/languages/texts/en_US.properties
          jar tf "$jar_file" | grep -Fx 'languages/texts/en_US.properties'

          if jar tf "$jar_file" | grep -Fx 'net/kyori/examination/Examinable.class' >/dev/null; then
            echo 'Examination API is present directly in the Hydraulic jar.'
          else
            found=false
            while IFS= read -r nested; do
              [ -n "$nested" ] || continue
              tmpdir=$(mktemp -d)
              if unzip -p "$jar_file" "$nested" > "$tmpdir/nested.jar" 2>/dev/null \
                && jar tf "$tmpdir/nested.jar" | grep -Fx 'net/kyori/examination/Examinable.class' >/dev/null; then
                echo "Examination API found in nested library: $nested"
                found=true
                rm -rf "$tmpdir"
                break
              fi
              rm -rf "$tmpdir"
            done < <(jar tf "$jar_file" | grep '^META-INF/jars/.*\.jar$' || true)

            if [ "$found" != true ]; then
              echo 'Production jar is missing net/kyori/examination/Examinable.class.'
              exit 1
            fi
          fi

      - name: Prepare Hydraulic gameplay fixture
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p fabric/run/mods
          test_mod=$(find test/build/libs -maxdepth 1 -type f \
            -name '*test-mod-fabric*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            ! -name '*-dev.jar' \
            ! -name '*-dev-shadow.jar' \
            | head -n 1)

          test -n "${test_mod}"
          cp "${test_mod}" fabric/run/mods/
          echo "Installed gameplay fixture: ${test_mod}"

      - name: Runtime verification - Minecraft 26.2
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p fabric/run
          printf 'eula=true\n' > fabric/run/eula.txt
          cat > fabric/run/server.properties <<'EOF'
          accept-transfers=false
          allow-flight=false
          difficulty=easy
          enable-command-block=false
          enable-jmx-monitoring=false
          enable-query=false
          enable-rcon=false
          enable-status=true
          enforce-secure-profile=true
          force-gamemode=false
          gamemode=survival
          generate-structures=true
          hardcore=false
          level-name=world
          max-players=10
          online-mode=false
          prevent-proxy-connections=false
          pvp=true
          server-ip=
          server-port=25565
          simulation-distance=10
          spawn-animals=true
          spawn-monsters=true
          spawn-npcs=true
          use-native-transport=true
          view-distance=10
          white-list=false
          EOF

          test -s fabric/run/eula.txt
          test -s fabric/run/server.properties
          test -n "$(find fabric/run/mods -maxdepth 1 -type f -name '*.jar' -print -quit)"

          set +e
          timeout --signal=TERM 90s ./gradlew :fabric:runServer --no-daemon 2>&1 | tee runtime-26.2.log
          server_exit=${PIPESTATUS[0]}
          set -e

          if ! grep -Eq 'Done \(' runtime-26.2.log; then
            echo 'Runtime verification failed: the dedicated server never reached Done.'
            exit 1
          fi

          if ! grep -Eq 'Loading Minecraft 26\.2' runtime-26.2.log; then
            echo 'Runtime verification failed: Fabric did not report Minecraft 26.2.'
            exit 1
          fi

          if ! grep -Eq 'hydraulic|Hydraulic' runtime-26.2.log; then
            echo 'Runtime verification failed: Hydraulic was not present in the server startup log.'
            exit 1
          fi

          if ! grep -Eq 'hydraulic_test_mod' runtime-26.2.log; then
            echo 'Runtime verification failed: Hydraulic Test Mod did not load.'
            exit 1
          fi

          if ! grep -Eq 'Converting pack for mod hydraulic_test_mod' runtime-26.2.log; then
            echo 'Runtime verification failed: Hydraulic did not convert the gameplay fixture resource pack.'
            exit 1
          fi

          converted_packs=$(grep -c 'Pack conversion completed successfully!' runtime-26.2.log || true)
          if [ "${converted_packs}" -lt 2 ]; then
            echo "Runtime verification failed: expected at least 2 successful pack conversions, got ${converted_packs}."
            exit 1
          fi

          echo "Hydraulic Minecraft 26.2 server exited with code ${server_exit} after verification."

      - name: Verify generated Bedrock gameplay pack
        shell: bash
        run: |
          set -euo pipefail

          pack=$(find fabric/run -type f -path '*/storage/hydraulic_test_mod/hydraulic_test_mod.mcpack' -print -quit)
          if [ -z "$pack" ]; then
            echo 'Gameplay pack verification failed: hydraulic_test_mod.mcpack was not generated.'
            find fabric/run -type f -name '*.mcpack' -print || true
            exit 1
          fi

          test -s "$pack"
          echo "Generated gameplay pack: $pack ($(stat -c '%s' "$pack") bytes)"

          zipinfo -1 "$pack" | grep -Fx 'manifest.json'

          entries=$(zipinfo -1 "$pack" | grep -E '\.(json|png)$' | wc -l)
          if [ "$entries" -lt 5 ]; then
            echo "Gameplay pack verification failed: expected at least 5 converted resource files, got $entries."
            exit 1
          fi

          if ! zipinfo -1 "$pack" | grep -Eq '^textures/.*\.png$'; then
            echo 'Gameplay pack verification failed: no converted Bedrock texture was found.'
            exit 1
          fi

          if ! unzip -p "$pack" manifest.json | grep -q 'hydraulic_test_mod'; then
            echo 'Gameplay pack verification failed: manifest does not identify hydraulic_test_mod.'
            exit 1
          fi

          echo 'Verified generated Bedrock pack contains manifest, converted resources, and textures.'

      - name: Archive Artifacts
        uses: GeyserMC/actions/upload-multi-artifact@master
        if: success()
        with:
          artifacts: |
            fabric/build/libs/hydraulic-fabric.jar

      - name: Get Version
        if: ${{ success() && github.repository == 'GeyserMC/Hydraulic' && github.ref_name == 'master' }}
        id: get-version
        run: |
          version=$(cat gradle.properties | grep -o "^version=[0-9\\.]*" | cut -d"=" -f2)
          echo "VERSION=${version}" >> $GITHUB_OUTPUT

      - name: Get Release Metadata
        if: ${{ success() && github.repository == 'GeyserMC/Hydraulic' && github.ref_name == 'master' }}
        uses: GeyserMC/actions/release@master
        id: metadata
        with:
          appID: ${{ secrets.RELEASE_APP_ID }}
          appPrivateKey: ${{ secrets.RELEASE_APP_PK }}
          files: |
            fabric:fabric/build/libs/hydraulic-fabric.jar
          releaseEnabled: false
          saveMetadata: true
          releaseProject: 'hydraulic'
          releaseVersion: ${{ steps.get-version.outputs.VERSION }}

      - name: Publish to Downloads API
        if: ${{ success() && github.repository == 'GeyserMC/Hydraulic' && github.ref_name == 'master' }}
        uses: GeyserMC/actions/upload-release@master
        with:
          username: ${{ vars.DOWNLOADS_USERNAME }}
          privateKey: ${{ secrets.DOWNLOADS_PRIVATE_KEY }}
          host: ${{ secrets.DOWNLOADS_SERVER_IP }}
          files: |
            fabric:fabric/build/libs/hydraulic-fabric.jar
          changelog: ${{ steps.metadata.outputs.body }}

      - name: Notify Discord
        if: ${{ (success() || failure()) && github.repository == 'GeyserMC/Hydraulic' }}
        uses: GeyserMC/actions/notify-discord@master
        with:
          discordWebhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          body: ${{ steps.metadata.outputs.body }}
