name: Build Pull Request

on:
  pull_request:
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/*.yml'
      - '.github/actions/build.yml'
      - '.idea/copyright/*.xml' 
      - '.gitignore'
      - 'LICENSE'
      - 'README.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Gradle
        uses: GeyserMC/actions/setup-gradle-composite@master
        with:
          setup-java_java-version: 25
          setup-gradle_cache-read-only: true

      - name: Read converter revision
        id: converter
        run: echo "ref=$(cat gradle/pack-converter.ref)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: nguyenphuck2468-tech/PackConverter
          ref: ${{ steps.converter.outputs.ref }}
          path: .converter-build
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build exact converter dependency
        working-directory: .converter-build
        run: ./gradlew publishToMavenLocal

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Build Hydraulic
        run: ./gradlew build

      - name: Archive Artifacts
        uses: GeyserMC/actions/upload-multi-artifact@master
        if: success()
        with:
          artifacts: | 
            fabric/build/libs/hydraulic-fabric.jar
