name: Build Pull Request

on:
  pull_request:
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/*.yml'
      - '.github/actions/build.yml'
      - '.idea/copyright/*.xml' 
      - '.gitignore'
      - 'LICENSE'
      - 'README.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Gradle
        uses: GeyserMC/actions/setup-gradle-composite@master
        with:
          setup-java_java-version: 25
          setup-gradle_cache-read-only: true

      - name: Check out tested PackConverter
        uses: actions/checkout@v4
        with:
          repository: nguyenphuck2468-tech/PackConverter
          ref: ff3d22e484abf7551ca0f05be5e35737f4faf1dc
          path: .packconverter

      - name: Set up converter Gradle launcher
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Test and publish exact converter locally
        working-directory: .packconverter
        run: ./gradlew :converter:test :converter:publishToMavenLocal :pack-schema-api:publishToMavenLocal :bedrock-pack-schema:publishToMavenLocal -PtestJavaVersion=25

      - name: Restore Java 25 for Hydraulic
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build Hydraulic
        run: ./gradlew build

      - name: Archive Artifacts
        uses: GeyserMC/actions/upload-multi-artifact@master
        if: success()
        with:
          artifacts: | 
            fabric/build/libs/hydraulic-fabric.jar
