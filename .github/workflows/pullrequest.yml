name: Build Pull Request

on:
  pull_request:
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/*.yml'
      - '.github/actions/build.yml'
      - '.idea/copyright/*.xml'
      - '.gitignore'
      - 'LICENSE'
      - 'README.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Gradle
        uses: GeyserMC/actions/setup-gradle-composite@master
        with:
          setup-java_java-version: 25
          setup-gradle_cache-read-only: true

      - name: Fetch Geyser language resources
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/GeyserMC/languages.git .ci/geyser-languages
          mkdir -p fabric/src/main/resources/languages/texts
          cp .ci/geyser-languages/texts/*.properties fabric/src/main/resources/languages/texts/
          test -s fabric/src/main/resources/languages/texts/en_US.properties
          echo "Geyser English locale installed: $(wc -c < fabric/src/main/resources/languages/texts/en_US.properties) bytes"

      - name: Build Hydraulic
        run: ./gradlew build

      - name: Prepare Hydraulic gameplay fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fabric/run/mods
          test_mod=$(find test/build/libs -maxdepth 1 -type f \
            -name '*test-mod-fabric*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            ! -name '*-dev.jar' \
            ! -name '*-dev-shadow.jar' \
            | head -n 1)
          test -n "${test_mod}"
          cp "${test_mod}" fabric/run/mods/
          echo "Installed gameplay fixture: ${test_mod}"

      - name: Runtime verification - Hydraulic on Minecraft 26.2 dedicated server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fabric/run
          printf 'eula=true\n' > fabric/run/eula.txt
          cat > fabric/run/server.properties <<'EOF'
          online-mode=false
          server-port=25565
          EOF
          test -n "$(find fabric/run/mods -maxdepth 1 -type f -name '*.jar' -print -quit)"

          set +e
          timeout --signal=TERM 90s ./gradlew :fabric:runServer --no-daemon 2>&1 | tee runtime-26.2.log
          server_exit=${PIPESTATUS[0]}
          set -e

          if ! grep -Eq 'Done \(' runtime-26.2.log; then
            echo 'Runtime verification failed: Hydraulic dedicated server never reached Done.'
            exit 1
          fi

          if ! grep -Eq 'Loading Minecraft 26\.2' runtime-26.2.log; then
            echo 'Runtime verification failed: Minecraft 26.2 was not reported by Fabric Loader.'
            exit 1
          fi

          if ! grep -Eq 'hydraulic|Hydraulic' runtime-26.2.log; then
            echo 'Runtime verification failed: Hydraulic was not present in the server startup log.'
            exit 1
          fi

          if ! grep -Eq 'hydraulic_test_mod' runtime-26.2.log; then
            echo 'Runtime verification failed: Hydraulic Test Mod did not load.'
            exit 1
          fi

          if ! grep -Eq 'Converting pack for mod hydraulic_test_mod' runtime-26.2.log; then
            echo 'Runtime verification failed: Hydraulic did not convert the gameplay fixture resource pack.'
            exit 1
          fi

          converted_packs=$(grep -c 'Pack conversion completed successfully!' runtime-26.2.log || true)
          if [ "${converted_packs}" -lt 2 ]; then
            echo "Runtime verification failed: expected at least 2 successful pack conversions, got ${converted_packs}."
            exit 1
          fi

          echo "Hydraulic Minecraft 26.2 server exited with code ${server_exit} after verification."

      - name: Archive Artifacts
        uses: GeyserMC/actions/upload-multi-artifact@master
        if: success()
        with:
          artifacts: |
            fabric/build/libs/hydraulic-fabric.jar
