name: Build Pull Request

on:
  pull_request:
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/*.yml'
      - '.github/actions/build.yml'
      - '.idea/copyright/*.xml'
      - '.gitignore'
      - 'LICENSE'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: hydraulic-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PACK_CONVERTER_REPO: nguyenphuck2468-tech/PackConverter
  # Match the production integration revision; PR checks must not silently
  # consume a newer PackConverter master than the release workflow.
  PACK_CONVERTER_REF: e454a145e782bf742f0c7a18f84e36597a75fbc3

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Hydraulic source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Gradle and Java
        uses: GeyserMC/actions/setup-gradle-composite@e4d4a9d33249b7303094470d4a1e49a6fa6643d4
        with:
          setup-java_java-version: 25
          setup-gradle_cache-read-only: true

      - name: Checkout PackConverter integration source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ env.PACK_CONVERTER_REPO }}
          ref: ${{ env.PACK_CONVERTER_REF }}
          path: PackConverter
          persist-credentials: false

      - name: Verify PackConverter checkout
        working-directory: PackConverter
        run: |
          test -f settings.gradle.kts
          test -f converter/build.gradle.kts
          test "$(git rev-parse HEAD)" = "$PACK_CONVERTER_REF"
          git status --short

      - name: Test PackConverter integration source
        working-directory: PackConverter
        run: gradle :converter:test --no-daemon --stacktrace --warning-mode all

      - name: Publish PackConverter modules to local Maven
        working-directory: PackConverter
        run: |
          gradle :pack-schema-api:publishToMavenLocal :converter:publishToMavenLocal --no-daemon --stacktrace

      - name: Build Hydraulic
        run: ./gradlew build --no-daemon --stacktrace

      - name: Archive Artifacts
        uses: GeyserMC/actions/upload-multi-artifact@e4d4a9d33249b7303094470d4a1e49a6fa6643d4
        if: success()
        with:
          artifacts: |
            fabric/build/libs/hydraulic-fabric.jar
            neoforge/build/libs/hydraulic-neoforge.jar
