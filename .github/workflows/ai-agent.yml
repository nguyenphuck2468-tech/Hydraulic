name: AI Developer Agent - Upgrade Build Fix

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task for the AI developer agent"
        required: true
        default: "Upgrade the project to Minecraft 26.2 and improve Geyser/Bedrock compatibility while preserving existing functionality."

      max_attempts:
        description: "Maximum AI repair attempts"
        required: false
        default: "5"

permissions:
  contents: write

concurrency:
  group: ai-agent-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ai-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      AI_MODEL: ${{ vars.AI_MODEL || 'openai/gpt-4.1-mini' }}
      MAX_ATTEMPTS: ${{ inputs.max_attempts || '5' }}
      TASK: ${{ inputs.task }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:

      # ============================================================
      # Validate API key
      # ============================================================

      - name: Validate AI secret
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${OPENROUTER_API_KEY:-}" ]]; then
            echo "::error::Missing OPENROUTER_API_KEY repository secret."
            exit 1
          fi

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # ============================================================
      # Configure Git
      # ============================================================

      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "AI Developer Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ============================================================
      # Java 25
      # ============================================================

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      # ============================================================
      # Gradle
      # ============================================================

      - name: Prepare Gradle
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew

      # ============================================================
      # Create / select AI branch
      # ============================================================

      - name: Prepare AI branch
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="ai-agent/${GITHUB_RUN_ID}"

          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

          echo "AI branch: $BRANCH"

          git fetch origin --prune

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Remote branch already exists."

            git switch -C "$BRANCH" "origin/$BRANCH"
          else
            echo "Creating new AI branch."

            git switch -c "$BRANCH"
          fi

      # ============================================================
      # Initial build
      # ============================================================

      - name: Initial build
        id: initial_build
        continue-on-error: true
        shell: bash
        run: |
          set +e

          ./gradlew build --stacktrace 2>&1 |
            tee /tmp/gradle-build.log

          code=${PIPESTATUS[0]}

          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

          exit 0

      # ============================================================
      # AI Developer Loop
      # ============================================================

      - name: AI developer loop
        shell: bash
        run: |

          set -euo pipefail

          python3 <<'PY'

          import json
          import os
          import subprocess
          import textwrap
          import urllib.request
          import urllib.error
          import time


          # ==========================================================
          # Configuration
          # ==========================================================

          ROOT = os.getcwd()

          API_KEY = os.environ["OPENROUTER_API_KEY"]

          MODEL = os.environ["AI_MODEL"]

          TASK = os.environ["TASK"]

          MAX_ATTEMPTS = int(
              os.environ["MAX_ATTEMPTS"]
          )

          MAX_OUTPUT_TOKENS = 20000


          # ==========================================================
          # Directories never sent to AI
          # ==========================================================

          IGNORED_DIRS = {
              ".git",
              ".gradle",
              "build",
              "node_modules",
              ".venv",
              "__pycache__",
              ".idea",
              ".vscode"
          }


          # ==========================================================
          # Relevant source files
          # ==========================================================

          ALLOWED_SUFFIXES = {
              ".java",
              ".kt",
              ".kts",
              ".groovy",
              ".gradle",
              ".properties",
              ".toml",
              ".json",
              ".xml",
              ".yaml",
              ".yml",
              ".md",
              ".txt"
          }


          # ==========================================================
          # Command helper
          # ==========================================================

          def run(
              cmd,
              check=False,
              timeout=None
          ):

              return subprocess.run(
                  cmd,
                  cwd=ROOT,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  check=check,
                  timeout=timeout
              )


          # ==========================================================
          # Collect repository files
          # ==========================================================

          def collect_files():

              result = run(
                  ["git", "ls-files"]
              )

              files = []

              for rel in result.stdout.splitlines():

                  if not rel:
                      continue

                  parts = rel.split("/")

                  if any(
                      part in IGNORED_DIRS
                      for part in parts
                  ):
                      continue

                  if rel.startswith(
                      ".github/workflows/"
                  ):
                      continue

                  path = os.path.join(
                      ROOT,
                      rel
                  )

                  if not os.path.isfile(path):
                      continue

                  try:
                      size = os.path.getsize(path)
                  except OSError:
                      continue

                  if size > 150_000:
                      continue

                  suffix = os.path.splitext(
                      rel
                  )[1].lower()

                  if suffix in ALLOWED_SUFFIXES:
                      files.append(rel)

              return files


          # ==========================================================
          # Build project context
          # ==========================================================

          def project_context():

              files = collect_files()

              priority = [

                  "gradle.properties",

                  "settings.gradle.kts",

                  "settings.gradle",

                  "build.gradle.kts",

                  "build.gradle",

                  "gradle/libs.versions.toml",

                  "fabric/build.gradle.kts",

                  "neoforge/build.gradle.kts",

                  "shared/build.gradle.kts",

                  "fabric/src/main/resources/fabric.mod.json",

                  "neoforge/src/main/resources/META-INF/neoforge.mods.toml"

              ]

              ordered = []

              for item in priority:

                  if item in files:
                      ordered.append(item)

              for item in files:

                  if item not in ordered:
                      ordered.append(item)

              chunks = []

              total = 0

              MAX_CHARS = 80000

              for rel in ordered:

                  path = os.path.join(
                      ROOT,
                      rel
                  )

                  try:

                      with open(
                          path,
                          "r",
                          encoding="utf-8",
                          errors="replace"
                      ) as f:

                          content = f.read()

                  except Exception:

                      continue

                  piece = (
                      "\n"
                      "==================================================\n"
                      f"FILE: {rel}\n"
                      "==================================================\n"
                      f"{content}\n"
                  )

                  if (
                      total +
                      len(piece)
                      > MAX_CHARS
                  ):
                      break

                  chunks.append(piece)

                  total += len(piece)

              return "".join(chunks)


          # ==========================================================
          # Call OpenRouter
          # ==========================================================

          def call_ai(prompt):

              payload = {

                  "model": MODEL,

                  "messages": [

                      {
                          "role": "system",

                          "content": (
                              "You are a senior Minecraft mod "
                              "developer and repository maintainer. "

                              "You are working directly against "
                              "a real Git repository. "

                              "Analyze the provided source code, "
                              "build output and task carefully. "

                              "Make safe, minimal and technically "
                              "correct changes. "

                              "Preserve existing functionality. "

                              "Do not blindly upgrade dependencies. "

                              "Do not remove functionality merely "
                              "to make the build pass. "

                              "Keep Fabric and NeoForge implementations "
                              "properly separated. "

                              "Pay particular attention to Minecraft "
                              "version compatibility, mappings, "
                              "Fabric Loader, Fabric API, NeoForge, "
                              "Geyser compatibility, resource packs, "
                              "items, blocks, models and networking. "

                              "Do not modify secrets. "

                              "Do not modify GitHub workflow files. "

                              "Do not modify Gradle wrapper files. "

                              "Do not commit or push. "

                              "Return ONLY a unified git diff "
                              "that can be applied with git apply. "
                          )
                      },

                      {
                          "role": "user",
                          "content": prompt
                      }

                  ],

                  "temperature": 0.1,

                  "max_tokens": MAX_OUTPUT_TOKENS

              }


              request = urllib.request.Request(

                  "https://openrouter.ai/api/v1/chat/completions",

                  data=json.dumps(
                      payload
                  ).encode(),

                  headers={

                      "Authorization":
                          f"Bearer {API_KEY}",

                      "Content-Type":
                          "application/json",

                      "HTTP-Referer":
                          "https://github.com/"
                          + os.environ[
                              "GITHUB_REPOSITORY"
                          ],

                      "X-Title":
                          "Minecraft AI Developer Agent"

                  },

                  method="POST"

              )


              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=300
                  ) as response:

                      data = json.load(
                          response
                      )

              except urllib.error.HTTPError as e:

                  body = e.read().decode(
                      errors="replace"
                  )

                  raise RuntimeError(
                      "OpenRouter HTTP "
                      f"{e.code}: "
                      f"{body[:5000]}"
                  )


              try:

                  return data[
                      "choices"
                  ][0][
                      "message"
                  ][
                      "content"
                  ]

              except Exception:

                  raise RuntimeError(
                      "Unexpected OpenRouter response:\n"
                      + json.dumps(
                          data,
                          indent=2
                      )[:5000]
                  )


          # ==========================================================
          # Read build log
          # ==========================================================

          build_log_path = (
              "/tmp/gradle-build.log"
          )

          if os.path.exists(
              build_log_path
          ):

              previous_output = open(
                  build_log_path,
                  encoding="utf-8",
                  errors="replace"
              ).read()

          else:

              previous_output = ""


          # ==========================================================
          # AI development loop
          # ==========================================================

          for attempt in range(
              1,
              MAX_ATTEMPTS + 1
          ):

              print()
              print(
                  "=================================================="
              )
              print(
                  f"AI DEVELOPMENT ATTEMPT "
                  f"{attempt}/{MAX_ATTEMPTS}"
              )
              print(
                  "=================================================="
              )


              context = project_context()


              current_diff = run([
                  "git",
                  "diff",
                  "--",
                  ".",
                  ":(exclude).github/workflows",
                  ":(exclude)gradle/wrapper"
              ]).stdout


              status = run([
                  "git",
                  "status",
                  "--short"
              ]).stdout


              prompt = textwrap.dedent(
                  f"""

                  Repository:
                  {os.environ['GITHUB_REPOSITORY']}

                  Task:
                  {TASK}

                  AI development attempt:
                  {attempt}/{MAX_ATTEMPTS}


                  IMPORTANT OBJECTIVE:

                  This is NOT only a build-fix task.

                  If the existing build already passes,
                  perform the requested upgrade or improvement.

                  If the build fails, fix the actual cause.

                  After making changes, the repository must build
                  successfully.


                  CURRENT BUILD OUTPUT:

                  ---------------- BUILD OUTPUT ----------------

                  {previous_output[-15000:]}

                  ------------------------------------------------


                  CURRENT GIT STATUS:

                  {status}


                  CURRENT DIFF:

                  ---------------- DIFF ----------------

                  {current_diff[-10000:]}

                  ------------------------------------------------


                  REPOSITORY SOURCE:

                  {context}


                  REQUIREMENTS:

                  - Read and understand the available repository
                    source before changing code.

                  - Perform the requested task rather than merely
                    fixing unrelated warnings.

                  - If upgrading Minecraft, verify every relevant
                    version declaration.

                  - Check Gradle properties.

                  - Check libs.versions.toml.

                  - Check Fabric metadata.

                  - Check NeoForge metadata.

                  - Check shared code.

                  - Check Fabric-specific code.

                  - Check NeoForge-specific code.

                  - Check resource-pack code.

                  - Check Geyser-related integration.

                  - Check Minecraft-version-specific APIs.

                  - Check mappings and dependency compatibility.

                  - Fix deprecated APIs when they are directly
                    related to the requested upgrade.

                  - Preserve existing behavior.

                  - Do not remove features simply to make the
                    build pass.

                  - Do not introduce unnecessary dependencies.

                  - Do not perform broad unrelated refactoring.

                  - Do not change ASM unless actually required.

                  - Do not modify .github/workflows.

                  - Do not modify Gradle wrapper files.

                  - Do not modify secrets.

                  - Do not commit.

                  - Do not push.

                  - Return ONLY a unified git diff.

                  If no changes are necessary, return an empty response.
                  """
              )


              response = call_ai(
                  prompt
              )


              # ======================================================
              # Extract patch
              # ======================================================

              start = response.find(
                  "diff --git "
              )


              if start >= 0:

                  patch = response[start:]

              else:

                  patch = response.strip()


              if not patch:

                  print(
                      "AI returned no patch."
                  )

                  break


              patch_file = (
                  "/tmp/ai.patch"
              )


              with open(
                  patch_file,
                  "w",
                  encoding="utf-8"
              ) as f:

                  f.write(patch)


              # ======================================================
              # Validate patch
              # ======================================================

              check = run([
                  "git",
                  "apply",
                  "--check",
                  patch_file
              ])


              if check.returncode != 0:

                  print(
                      "AI patch failed validation:"
                  )

                  print(
                      check.stdout[-10000:]
                  )

                  previous_output = (
                      check.stdout
                  )

                  continue


              # ======================================================
              # Apply patch
              # ======================================================

              run([
                  "git",
                  "apply",
                  "--whitespace=fix",
                  patch_file
              ], check=True)


              # ======================================================
              # Ensure protected files unchanged
              # ======================================================

              protected = run([
                  "git",
                  "diff",
                  "--name-only",
                  "--",
                  ".github/workflows",
                  "gradle/wrapper",
                  ".gitignore"
              ]).stdout.strip()


              if protected:

                  print(
                      "AI attempted to modify "
                      "protected files:"
                  )

                  print(protected)

                  run([
                      "git",
                      "checkout",
                      "--",
                      ".github/workflows",
                      "gradle/wrapper",
                      ".gitignore"
                  ])


              # ======================================================
              # Show changes
              # ======================================================

              status = run([
                  "git",
                  "status",
                  "--short"
              ]).stdout

              print(status)


              # ======================================================
              # Build
              # ======================================================

              print(
                  "Running Gradle build..."
              )


              build = run(
                  [
                      "bash",
                      "-lc",
                      "./gradlew build --stacktrace"
                  ],
                  timeout=900
              )


              with open(
                  "/tmp/gradle-build.log",
                  "w",
                  encoding="utf-8"
              ) as f:

                  f.write(
                      build.stdout
                  )


              print(
                  build.stdout[-20000:]
              )


              # ======================================================
              # Build passed
              # ======================================================

              if build.returncode == 0:

                  print()
                  print(
                      "=================================================="
                  )
                  print(
                      "BUILD PASSED"
                  )
                  print(
                      "=================================================="
                  )

                  break


              # ======================================================
              # Build failed
              # ======================================================

              print()
              print(
                  "BUILD FAILED."
              )

              print(
                  "AI will analyze the new build output."
              )


              previous_output = (
                  build.stdout
              )


              time.sleep(2)


          else:

              print(
                  "Maximum AI attempts exhausted."
              )

              raise SystemExit(1)

          PY

      # ============================================================
      # Final build verification
      # ============================================================

      - name: Final build verification
        id: final_build
        shell: bash
        run: |
          set +e

          ./gradlew build --stacktrace 2>&1 |
            tee /tmp/final-build.log

          code=${PIPESTATUS[0]}

          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

          exit 0

      # ============================================================
      # Verify protected files
      # ============================================================

      - name: Verify protected files
        shell: bash
        run: |
          set -euo pipefail

          forbidden="$(
            git diff --name-only -- \
              '.github/workflows' \
              'gradle/wrapper' \
              '.gitignore'
          )"

          if [[ -n "${forbidden// }" ]]; then
            echo "::error::AI modified protected files:"
            echo "$forbidden"
            exit 1
          fi

      # ============================================================
      # Show final changes
      # ============================================================

      - name: Show final changes
        shell: bash
        run: |
          echo "=========================================="
          echo "FINAL BRANCH"
          echo "=========================================="

          git branch --show-current

          echo
          echo "=========================================="
          echo "CHANGED FILES"
          echo "=========================================="

          git status --short

          echo
          echo "=========================================="
          echo "DIFF STAT"
          echo "=========================================="

          git diff --stat

      # ============================================================
      # Commit
      # ============================================================

      - name: Commit AI changes
        if: steps.final_build.outputs.exit_code == '0'
        shell: bash
        run: |
          set -euo pipefail

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "feat: AI-assisted Minecraft upgrade"

      # ============================================================
      # Push branch
      # ============================================================

      - name: Push AI branch
        if: steps.final_build.outputs.exit_code == '0'
        shell: bash
        run: |
          set -euo pipefail

          git push \
            --set-upstream \
            origin \
            "$BRANCH"

      # ============================================================
      # Upload logs
      # ============================================================

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-agent-build-logs
          path: |
            /tmp/gradle-build.log
            /tmp/final-build.log
          if-no-files-found: ignore

      # ============================================================
      # Fail if final build failed
      # ============================================================

      - name: Fail if final build failed
        if: steps.final_build.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "::error::Final Gradle build failed."
          echo "AI branch was not committed."
          exit 1
