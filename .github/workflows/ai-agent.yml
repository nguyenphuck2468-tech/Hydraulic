name: AI Developer Agent

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Target branch"
        required: true
        default: "ai-dev"
        type: string

      task:
        description: "Task for the AI developer"
        required: true
        type: string

      max_attempts:
        description: "Maximum AI attempts"
        required: false
        default: "5"
        type: string

permissions:
  contents: write

concurrency:
  group: ai-developer-${{ github.repository }}-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  ai-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      AI_MODEL: ${{ vars.AI_MODEL || 'openai/gpt-4.1-mini' }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TARGET_BRANCH: ${{ inputs.branch }}
      TASK: ${{ inputs.task }}
      MAX_ATTEMPTS: ${{ inputs.max_attempts }}

    steps:

      # ============================================================
      # Validate API key
      # ============================================================

      - name: Validate AI secret
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${OPENROUTER_API_KEY:-}" ]]; then
            echo "::error::Missing OPENROUTER_API_KEY repository secret."
            exit 1
          fi

      # ============================================================
      # Checkout repository
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # Configure Git
      # ============================================================

      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "AI Developer Agent"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      # ============================================================
      # Prepare target branch
      # ============================================================

      - name: Prepare target branch
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="${TARGET_BRANCH}"

          if [[ -z "$BRANCH" ]]; then
            echo "::error::Target branch is empty."
            exit 1
          fi

          if [[ "$BRANCH" == "master" || "$BRANCH" == "main" ]]; then
            echo "::error::Use a dedicated AI development branch."
            exit 1
          fi

          echo "Target branch: $BRANCH"

          git fetch origin --prune

          if git ls-remote \
              --exit-code \
              --heads origin "$BRANCH" >/dev/null 2>&1
          then

            echo "Branch '$BRANCH' exists."

            git checkout -B \
              "$BRANCH" \
              "origin/$BRANCH"

          else

            echo "Branch '$BRANCH' does not exist."

            # Create branch from the repository default branch
            DEFAULT_BRANCH="$(
              git remote show origin |
              sed -n '/HEAD branch/s/.*: //p'
            )"

            if [[ -z "$DEFAULT_BRANCH" ]]; then
              DEFAULT_BRANCH="main"
            fi

            echo "Creating '$BRANCH' from '$DEFAULT_BRANCH'."

            git fetch origin "$DEFAULT_BRANCH"

            git checkout -b \
              "$BRANCH" \
              "origin/$DEFAULT_BRANCH"

          fi

          echo "Current branch:"
          git branch --show-current

      # ============================================================
      # Java 25
      # ============================================================

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      # ============================================================
      # Gradle
      # ============================================================

      - name: Prepare Gradle
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

      # ============================================================
      # Initial build
      # ============================================================

      - name: Initial build
        id: initial_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail

          ./gradlew build --stacktrace 2>&1 |
            tee /tmp/initial-build.log

          echo "exit_code=${PIPESTATUS[0]}" \
            >> "$GITHUB_OUTPUT"

      # ============================================================
      # AI Developer
      # ============================================================

      - name: Run AI Developer
        shell: bash
        run: |

          set -euo pipefail

          python3 <<'PY'

          import json
          import os
          import subprocess
          import textwrap
          import urllib.request
          import urllib.error


          ROOT = os.getcwd()

          API_KEY = os.environ["OPENROUTER_API_KEY"]
          MODEL = os.environ["AI_MODEL"]
          TASK = os.environ["TASK"]
          TARGET_BRANCH = os.environ["TARGET_BRANCH"]

          MAX_ATTEMPTS = int(
              os.environ["MAX_ATTEMPTS"]
          )


          # ========================================================
          # Ignored directories
          # ========================================================

          IGNORED_DIRS = {
              ".git",
              ".gradle",
              "build",
              "node_modules",
              ".venv",
              "__pycache__",
              ".idea"
          }


          # ========================================================
          # Relevant source/config files
          # ========================================================

          ALLOWED_SUFFIXES = {
              ".java",
              ".kt",
              ".kts",
              ".groovy",
              ".gradle",
              ".properties",
              ".toml",
              ".json",
              ".xml",
              ".yaml",
              ".yml",
              ".md",
              ".txt"
          }


          # ========================================================
          # Command helper
          # ========================================================

          def run(cmd, check=False):

              return subprocess.run(
                  cmd,
                  cwd=ROOT,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  check=check
              )


          # ========================================================
          # Collect project files
          # ========================================================

          def collect_project():

              result = run([
                  "git",
                  "ls-files"
              ])

              files = []

              for rel in result.stdout.splitlines():

                  if not rel:
                      continue

                  parts = rel.split("/")

                  if any(
                      part in IGNORED_DIRS
                      for part in parts
                  ):
                      continue

                  path = os.path.join(
                      ROOT,
                      rel
                  )

                  if not os.path.isfile(path):
                      continue

                  try:
                      size = os.path.getsize(path)
                  except OSError:
                      continue

                  if size > 200_000:
                      continue

                  suffix = os.path.splitext(
                      rel
                  )[1].lower()

                  if suffix in ALLOWED_SUFFIXES:
                      files.append(rel)

              return files


          # ========================================================
          # Build project context
          # ========================================================

          def project_context():

              files = collect_project()

              priority = [

                  "gradle.properties",

                  "settings.gradle.kts",
                  "settings.gradle",

                  "build.gradle.kts",
                  "build.gradle",

                  "gradle/libs.versions.toml",

                  "fabric/build.gradle.kts",
                  "fabric/build.gradle",

                  "neoforge/build.gradle.kts",
                  "neoforge/build.gradle",

                  "fabric/src/main/resources/fabric.mod.json",

                  "neoforge/src/main/resources/"
                  "META-INF/neoforge.mods.toml"
              ]


              ordered = [
                  x for x in priority
                  if x in files
              ]


              ordered += [
                  x for x in files
                  if x not in ordered
              ]


              chunks = []

              total = 0

              max_chars = 180_000


              for rel in ordered:

                  path = os.path.join(
                      ROOT,
                      rel
                  )

                  try:

                      with open(
                          path,
                          encoding="utf-8"
                      ) as f:

                          content = f.read()

                  except Exception:

                      continue


                  piece = (
                      "\n"
                      f"===== FILE: {rel} =====\n"
                      f"{content}\n"
                  )


                  if (
                      total + len(piece)
                      > max_chars
                  ):
                      break


                  chunks.append(piece)

                  total += len(piece)


              return "".join(chunks)


          # ========================================================
          # Call OpenRouter
          # ========================================================

          def call_ai(prompt):

              payload = {

                  "model": MODEL,

                  "messages": [

                      {
                          "role": "system",

                          "content": textwrap.dedent(
                              """
                              You are an autonomous senior software
                              engineer working inside a Git repository.

                              Your job is to implement the user's task.

                              Before changing anything:

                              - inspect the repository;
                              - inspect the project architecture;
                              - inspect source code;
                              - inspect build configuration;
                              - inspect dependency versions;
                              - inspect mod metadata;
                              - inspect relevant tests and resources.

                              Requirements:

                              1. Implement the requested task correctly.

                              2. Preserve existing functionality.

                              3. Make focused changes.

                              4. Do not perform unrelated refactoring.

                              5. Do not remove functionality merely
                                 to make the build pass.

                              6. Keep Fabric and NeoForge concerns
                                 separated where applicable.

                              7. Update dependencies consistently when
                                 required by the task.

                              8. Update APIs when compatibility changes
                                 require it.

                              9. Do not modify secrets.

                              10. Do not modify GitHub Actions workflow
                                  files.

                              11. Do not modify Gradle wrapper files
                                  unless absolutely required.

                              12. Do not modify the AI workflow itself.

                              13. Do not commit.

                              14. Do not push.

                              15. Do not change ASM unless absolutely
                                  required.

                              16. Do not disable tests just to make the
                                  build pass.

                              17. Do not hide compiler errors or warnings
                                  by removing functionality.

                              After making changes, the CI system will
                              build the project.

                              If the build fails, diagnose the actual
                              cause and fix it.

                              Continue iteratively until the requested
                              task is implemented and the build passes.

                              Return ONLY a unified git diff suitable for:

                                  git apply

                              If no change is required, return an empty
                              response.
                              """
                          )
                      },

                      {
                          "role": "user",
                          "content": prompt
                      }

                  ],

                  "temperature": 0.1
              }


              request = urllib.request.Request(

                  "https://openrouter.ai/api/v1/chat/completions",

                  data=json.dumps(
                      payload
                  ).encode(),

                  headers={

                      "Authorization":
                          f"Bearer {API_KEY}",

                      "Content-Type":
                          "application/json",

                      "HTTP-Referer":
                          "https://github.com/"
                          f"{os.environ['GITHUB_REPOSITORY']}",

                      "X-Title":
                          "AI Developer Agent"
                  },

                  method="POST"
              )


              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=300
                  ) as response:

                      data = json.load(
                          response
                      )

              except urllib.error.HTTPError as e:

                  body = e.read().decode(
                      errors="replace"
                  )

                  raise RuntimeError(
                      f"OpenRouter HTTP {e.code}: "
                      f"{body[:5000]}"
                  )


              return (
                  data["choices"][0]["message"]["content"]
              )


          # ========================================================
          # Read initial build
          # ========================================================

          try:

              with open(
                  "/tmp/initial-build.log",
                  encoding="utf-8",
                  errors="replace"
              ) as f:

                  previous_build = f.read()

          except FileNotFoundError:

              previous_build = ""


          # ========================================================
          # AI loop
          # ========================================================

          success = False


          for attempt in range(
              1,
              MAX_ATTEMPTS + 1
          ):

              print()
              print(
                  "============================================"
              )
              print(
                  f"AI ATTEMPT "
                  f"{attempt}/{MAX_ATTEMPTS}"
              )
              print(
                  "============================================"
              )


              context = project_context()


              diff = run([
                  "git",
                  "diff"
              ]).stdout


              status = run([
                  "git",
                  "status",
                  "--short"
              ]).stdout


              prompt = textwrap.dedent(
                  f"""

                  Repository:
                  {os.environ['GITHUB_REPOSITORY']}

                  Target branch:
                  {TARGET_BRANCH}

                  User task:
                  {TASK}

                  Attempt:
                  {attempt}/{MAX_ATTEMPTS}

                  Repository status:
                  ----- BEGIN STATUS -----
                  {status[-10000:]}
                  ----- END STATUS -----

                  Current diff:
                  ----- BEGIN DIFF -----
                  {diff[-30000:]}
                  ----- END DIFF -----

                  Current build output:
                  ----- BEGIN BUILD OUTPUT -----
                  {previous_build[-40000:]}
                  ----- END BUILD OUTPUT -----

                  Relevant repository files:
                  {context}

                  Instructions:

                  - Implement the user's task.
                  - Analyze the existing implementation first.
                  - Make the minimum safe changes needed.
                  - Preserve existing behavior.
                  - Fix build errors caused by the changes.
                  - Do not modify GitHub workflows.
                  - Do not modify Gradle wrapper files.
                  - Do not perform unrelated refactoring.
                  - Do not remove functionality.
                  - Return ONLY a unified git diff.
                  """
              )


              response = call_ai(
                  prompt
              )


              # ====================================================
              # Extract patch
              # ====================================================

              start = response.find(
                  "diff --git "
              )


              if start >= 0:

                  patch = response[start:]

              else:

                  patch = response.strip()


              if not patch:

                  print(
                      "AI returned no patch."
                  )

                  break


              patch_file = "/tmp/ai.patch"


              with open(
                  patch_file,
                  "w",
                  encoding="utf-8"
              ) as f:

                  f.write(patch)


              # ====================================================
              # Validate patch
              # ====================================================

              check = run([
                  "git",
                  "apply",
                  "--check",
                  patch_file
              ])


              if check.returncode != 0:

                  print(
                      "AI generated an invalid patch."
                  )

                  print(
                      check.stdout[-15000:]
                  )

                  previous_build = check.stdout

                  continue


              # ====================================================
              # Apply patch
              # ====================================================

              run([
                  "git",
                  "apply",
                  "--whitespace=fix",
                  patch_file
              ], check=True)


              # ====================================================
              # Protect workflow files
              # ====================================================

              workflow_changes = run([
                  "git",
                  "diff",
                  "--name-only",
                  "--",
                  ".github/workflows"
              ]).stdout.strip()


              if workflow_changes:

                  print(
                      "AI attempted to modify workflow files."
                  )

                  run([
                      "git",
                      "restore",
                      "--",
                      ".github/workflows"
                  ])


              # ====================================================
              # Build
              # ====================================================

              build = run([
                  "bash",
                  "-lc",
                  "./gradlew build --stacktrace"
              ])


              previous_build = build.stdout


              print(
                  previous_build[-30000:]
              )


              if build.returncode == 0:

                  print()
                  print(
                      "============================================"
                  )
                  print(
                      "BUILD PASSED"
                  )
                  print(
                      "============================================"
                  )

                  success = True

                  break


              print(
                  "BUILD FAILED."
              )

              print(
                  "AI will analyze the failure and try again."
              )


          # ========================================================
          # Final result
          # ========================================================

          if not success:

              print(
                  "AI could not complete the task successfully."
              )

              raise SystemExit(1)

          PY

      # ============================================================
      # Final verification
      # ============================================================

      - name: Final build
        id: final_build
        shell: bash
        run: |

          set -o pipefail

          ./gradlew build --stacktrace 2>&1 |
            tee /tmp/final-build.log

          echo "exit_code=${PIPESTATUS[0]}" \
            >> "$GITHUB_OUTPUT"

      # ============================================================
      # Protect important files
      # ============================================================

      - name: Verify protected files
        shell: bash
        run: |

          set -euo pipefail

          forbidden="$(
            git diff --name-only -- \
              '.github/workflows' \
              'gradle/wrapper' \
              '.gitignore'
          )"

          if [[ -n "${forbidden// }" ]]; then

            echo "::error::Protected files were modified:"
            echo "$forbidden"

            exit 1

          fi

      # ============================================================
      # Show changes
      # ============================================================

      - name: Show changes
        if: always()
        shell: bash
        run: |

          echo "============================================"
          echo "Current branch:"
          git branch --show-current

          echo
          echo "Changed files:"
          git status --short

          echo
          echo "Diff statistics:"
          git diff --stat

      # ============================================================
      # Commit
      # ============================================================

      - name: Commit AI changes
        if: steps.final_build.outputs.exit_code == '0'
        shell: bash
        run: |

          set -euo pipefail

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "chore: AI-assisted development"

      # ============================================================
      # Push target branch
      # ============================================================

      - name: Push target branch
        if: steps.final_build.outputs.exit_code == '0'
        shell: bash
        run: |

          set -euo pipefail

          git push \
            origin \
            "HEAD:${TARGET_BRANCH}"

      # ============================================================
      # Upload logs
      # ============================================================

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-developer-build-logs

          path: |
            /tmp/initial-build.log
            /tmp/final-build.log

          if-no-files-found: ignore

      # ============================================================
      # Fail if final build failed
      # ============================================================

      - name: Fail if final build failed
        if: steps.final_build.outputs.exit_code != '0'
        shell: bash
        run: |

          echo "::error::Final Gradle build failed."
          echo "Changes were NOT pushed."

          exit 1
