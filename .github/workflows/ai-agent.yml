name: AI Developer Agent - Minecraft 26.2

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task for the AI developer"
        required: true
        default: |
          Upgrade Hydraulic to Minecraft 26.2.
          Update Fabric, NeoForge and Geyser compatibility.
          Preserve existing functionality and improve stability.
          Analyze the whole repository, make the required source/dependency changes,
          build the project, fix any errors automatically, and continue until the
          final build passes.

      max_attempts:
        description: "Maximum AI attempts"
        required: false
        default: "8"

      branch:
        description: "AI development branch"
        required: false
        default: "ai/minecraft-26.2-geyser"

permissions:
  contents: write

concurrency:
  group: ai-developer-${{ github.repository }}-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  ai-developer:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      AI_MODEL: ${{ vars.AI_MODEL || 'openai/gpt-4.1-mini' }}
      MAX_ATTEMPTS: ${{ inputs.max_attempts || '8' }}
      TASK: ${{ inputs.task }}
      AI_BRANCH: ${{ inputs.branch }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:

      # ============================================================
      # Validate secret
      # ============================================================

      - name: Validate OpenRouter API key
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${OPENROUTER_API_KEY:-}" ]]; then
            echo "::error::Missing OPENROUTER_API_KEY repository secret."
            exit 1
          fi

      # ============================================================
      # Checkout base repository
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # Git configuration
      # ============================================================

      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "AI Developer Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch --all --prune

      # ============================================================
      # Find or create AI branch
      # ============================================================

      - name: Find or create AI branch
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="${AI_BRANCH}"

          echo "=========================================="
          echo "AI DEVELOPMENT BRANCH"
          echo "=========================================="
          echo "Branch: $BRANCH"

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then

            echo "Existing remote branch found."
            echo "Checking out existing branch..."

            git fetch origin "$BRANCH:$BRANCH"
            git switch "$BRANCH"

          else

            echo "Remote branch does not exist."
            echo "Creating new branch from current base..."

            git switch -c "$BRANCH"

          fi

          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

          echo ""
          echo "Current branch:"
          git branch --show-current

          echo ""
          echo "Current commit:"
          git rev-parse --short HEAD

      # ============================================================
      # Java 25
      # ============================================================

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      # ============================================================
      # Gradle
      # ============================================================

      - name: Prepare Gradle
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew --version

      # ============================================================
      # Initial build
      # ============================================================

      - name: Initial build
        id: initial_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail

          ./gradlew build --stacktrace 2>&1 |
            tee /tmp/initial-build.log

          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # ============================================================
      # AI development loop
      # ============================================================

      - name: AI development loop
        shell: bash
        run: |

          set -euo pipefail

          python3 <<'PY'

          import json
          import os
          import re
          import subprocess
          import textwrap
          import urllib.request
          import urllib.error


          # ==========================================================
          # Configuration
          # ==========================================================

          ROOT = os.getcwd()

          API_KEY = os.environ["OPENROUTER_API_KEY"]

          MODEL = os.environ["AI_MODEL"]

          TASK = os.environ["TASK"]

          MAX_ATTEMPTS = int(os.environ["MAX_ATTEMPTS"])

          BRANCH = os.environ["AI_BRANCH"]


          # Keep the prompt reasonably small.
          MAX_CONTEXT_CHARS = 60000

          MAX_BUILD_LOG_CHARS = 24000

          MAX_DIFF_CHARS = 12000

          MAX_OUTPUT_TOKENS = 12000


          # ==========================================================
          # Directories never sent to AI
          # ==========================================================

          IGNORED_DIRS = {
              ".git",
              ".gradle",
              "build",
              "node_modules",
              ".venv",
              "__pycache__",
              ".idea",
              ".vscode"
          }


          # ==========================================================
          # Files AI is allowed to inspect
          # ==========================================================

          ALLOWED_SUFFIXES = {
              ".java",
              ".kt",
              ".kts",
              ".groovy",
              ".gradle",
              ".properties",
              ".toml",
              ".json",
              ".xml",
              ".yaml",
              ".yml",
              ".md",
              ".txt"
          }


          # ==========================================================
          # Files AI must never modify
          # ==========================================================

          PROTECTED_PATHS = [
              ".github/workflows/",
              "gradle/wrapper/",
              ".gitignore"
          ]


          # ==========================================================
          # Command helper
          # ==========================================================

          def run(cmd, check=False):

              return subprocess.run(
                  cmd,
                  cwd=ROOT,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  check=check
              )


          # ==========================================================
          # Project file collection
          # ==========================================================

          def collect_files():

              result = run(["git", "ls-files"])

              files = []

              for rel in result.stdout.splitlines():

                  rel = rel.strip()

                  if not rel:
                      continue

                  parts = rel.split("/")

                  if any(
                      part in IGNORED_DIRS
                      for part in parts
                  ):
                      continue

                  path = os.path.join(ROOT, rel)

                  if not os.path.isfile(path):
                      continue

                  try:
                      size = os.path.getsize(path)
                  except OSError:
                      continue

                  if size > 150000:
                      continue

                  suffix = os.path.splitext(rel)[1].lower()

                  if suffix in ALLOWED_SUFFIXES:
                      files.append(rel)

              return files


          # ==========================================================
          # Project context
          # ==========================================================

          def project_context():

              files = collect_files()

              priority = [

                  "gradle.properties",

                  "build.gradle",

                  "build.gradle.kts",

                  "settings.gradle",

                  "settings.gradle.kts",

                  "gradle/libs.versions.toml",

                  "fabric/build.gradle",

                  "fabric/build.gradle.kts",

                  "neoforge/build.gradle",

                  "neoforge/build.gradle.kts",

                  "shared/build.gradle",

                  "shared/build.gradle.kts",

                  "fabric/src/main/resources/fabric.mod.json",

                  "neoforge/src/main/resources/META-INF/neoforge.mods.toml"

              ]

              ordered = []

              for item in priority:

                  if item in files and item not in ordered:
                      ordered.append(item)

              for item in files:

                  if item not in ordered:
                      ordered.append(item)

              chunks = []

              total = 0

              for rel in ordered:

                  path = os.path.join(ROOT, rel)

                  try:

                      with open(
                          path,
                          "r",
                          encoding="utf-8",
                          errors="replace"
                      ) as f:

                          text = f.read()

                  except Exception:

                      continue

                  piece = (
                      f"\n===== FILE: {rel} =====\n"
                      f"{text}\n"
                  )

                  if total + len(piece) > MAX_CONTEXT_CHARS:
                      break

                  chunks.append(piece)

                  total += len(piece)

              return "".join(chunks)


          # ==========================================================
          # Current Git diff
          # ==========================================================

          def current_diff():

              result = run([
                  "git",
                  "diff",
                  "--",
                  ".",
                  ":(exclude).github/workflows"
              ])

              return result.stdout[-MAX_DIFF_CHARS:]


          # ==========================================================
          # OpenRouter request
          # ==========================================================

          def call_ai(prompt):

              payload = {

                  "model": MODEL,

                  "messages": [

                      {
                          "role": "system",

                          "content": textwrap.dedent(
                              """
                              You are an expert senior Minecraft mod engineer.

                              You are working directly on a Git repository.

                              Your task is to upgrade and repair the project
                              while preserving existing functionality.

                              IMPORTANT OUTPUT RULE:

                              Return ONLY a valid unified git diff.

                              The response MUST start with:

                              diff --git

                              Do NOT return:
                              - Markdown
                              - ```diff
                              - explanations
                              - analysis
                              - headings
                              - logs
                              - comments outside the patch
                              - AI attempt messages

                              If no change is required, return an empty response.

                              The patch must be directly usable with:

                              git apply

                              Never modify:
                              .github/workflows/
                              gradle/wrapper/
                              .gitignore

                              Never modify secrets.

                              Never commit.

                              Never push.

                              Preserve Fabric and NeoForge separation.

                              Do not remove functionality merely to make
                              the build pass.

                              Do not perform unrelated refactoring.

                              Prefer current APIs over deprecated APIs when
                              upgrading them is relevant.

                              For Minecraft upgrades, inspect dependency
                              compatibility carefully instead of blindly
                              changing every version.
                              """
                          )
                      },

                      {
                          "role": "user",

                          "content": prompt
                      }

                  ],

                  "temperature": 0.1,

                  "max_tokens": MAX_OUTPUT_TOKENS

              }


              request = urllib.request.Request(

                  "https://openrouter.ai/api/v1/chat/completions",

                  data=json.dumps(payload).encode("utf-8"),

                  headers={

                      "Authorization":
                          f"Bearer {API_KEY}",

                      "Content-Type":
                          "application/json",

                      "HTTP-Referer":
                          f"https://github.com/"
                          f"{os.environ['GITHUB_REPOSITORY']}",

                      "X-Title":
                          "Hydraulic Minecraft 26.2 AI Developer"

                  },

                  method="POST"
              )


              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=240
                  ) as response:

                      data = json.load(response)

              except urllib.error.HTTPError as e:

                  body = e.read().decode(
                      errors="replace"
                  )

                  raise RuntimeError(
                      f"OpenRouter HTTP {e.code}: "
                      f"{body[:5000]}"
                  )


              try:

                  return data["choices"][0]["message"]["content"]

              except Exception:

                  raise RuntimeError(
                      "Invalid OpenRouter response:\n"
                      + json.dumps(
                          data,
                          indent=2
                      )[:5000]
                  )


          # ==========================================================
          # Extract clean unified diff
          # ==========================================================

          def extract_patch(response):

              if not response:
                  return ""

              response = response.strip()

              # Remove accidental markdown fences.

              response = re.sub(
                  r"^```(?:diff|patch)?\s*",
                  "",
                  response,
                  flags=re.IGNORECASE
              )

              response = re.sub(
                  r"\s*```\s*$",
                  "",
                  response
              )

              start = response.find("diff --git")

              if start < 0:

                  return ""

              patch = response[start:]

              # Remove trailing markdown fence.

              fence = patch.find("\n```")

              if fence >= 0:
                  patch = patch[:fence]

              # Remove common accidental AI footer.

              patch = patch.rstrip()

              return patch


          # ==========================================================
          # Initial state
          # ==========================================================

          if os.path.exists("/tmp/initial-build.log"):

              previous_log = open(
                  "/tmp/initial-build.log",
                  encoding="utf-8",
                  errors="replace"
              ).read()

          else:

              previous_log = ""


          # ==========================================================
          # AI development loop
          # ==========================================================

          for attempt in range(1, MAX_ATTEMPTS + 1):

              print()
              print("=" * 60)
              print(
                  f"AI DEVELOPMENT ATTEMPT "
                  f"{attempt}/{MAX_ATTEMPTS}"
              )
              print("=" * 60)

              context = project_context()

              diff = current_diff()

              prompt = textwrap.dedent(
                  f"""
                  Repository:
                  {os.environ['GITHUB_REPOSITORY']}

                  Current branch:
                  {BRANCH}

                  Main task:
                  {TASK}

                  This is attempt {attempt} of {MAX_ATTEMPTS}.

                  OBJECTIVE:

                  Analyze the relevant repository source and perform
                  the requested Minecraft 26.2 upgrade.

                  In particular:

                  - Upgrade Minecraft compatibility to 26.2.
                  - Update Fabric compatibility where required.
                  - Update NeoForge compatibility where required.
                  - Update Geyser-related integration where required.
                  - Preserve Bedrock compatibility through Geyser.
                  - Preserve existing Hydraulic functionality.
                  - Review deprecated API usage related to the upgrade.
                  - Review dependency versions.
                  - Keep Fabric and NeoForge implementations separated.
                  - Improve stability rather than merely making Gradle pass.

                  If the current build is failing:

                  - Identify the actual root cause.
                  - Fix it.
                  - Do not hide or suppress the failure.

                  If the current build already succeeds:

                  - Continue the requested upgrade work.
                  - Do not stop simply because Gradle passes.

                  After every patch the repository will be built again.

                  CURRENT BUILD OUTPUT:

                  ----- BEGIN BUILD LOG -----

                  {previous_log[-MAX_BUILD_LOG_CHARS:]}

                  ----- END BUILD LOG -----


                  CURRENT UNCOMMITTED DIFF:

                  ----- BEGIN DIFF -----

                  {diff}

                  ----- END DIFF -----


                  REPOSITORY CONTEXT:

                  {context}


                  HARD REQUIREMENTS:

                  - Return ONLY a valid unified git diff.
                  - The response must begin with "diff --git".
                  - Do not use markdown fences.
                  - Do not include explanations.
                  - Do not include logs.
                  - Do not modify .github/workflows/.
                  - Do not modify gradle/wrapper/.
                  - Do not modify .gitignore.
                  - Do not modify secrets.
                  - Do not commit.
                  - Do not push.
                  - Do not remove existing features.
                  - Do not make unrelated refactors.
                  - Do not blindly upgrade unrelated dependencies.
                  - Do not change ASM unless required by compatibility.
                  - Keep the change focused on Minecraft 26.2,
                    Geyser compatibility, stability and actual build/runtime
                    compatibility.
                  """
              )

              try:

                  response = call_ai(prompt)

              except Exception as e:

                  print("AI request failed:")
                  print(str(e))

                  previous_log = (
                      "AI REQUEST FAILURE:\n"
                      + str(e)
                  )

                  continue


              patch = extract_patch(response)

              if not patch:

                  print(
                      "AI did not return a valid unified diff."
                  )

                  previous_log = textwrap.dedent(
                      """
                      The previous AI response was invalid.

                      Return ONLY a unified git diff.

                      It MUST start with:
                      diff --git

                      Do not include markdown fences,
                      explanations, logs, headings or analysis.
                      """
                  )

                  continue


              patch_file = "/tmp/ai.patch"

              with open(
                  patch_file,
                  "w",
                  encoding="utf-8"
              ) as f:

                  f.write(patch + "\n")


              # ======================================================
              # Validate patch
              # ======================================================

              check = run([
                  "git",
                  "apply",
                  "--check",
                  "--recount",
                  patch_file
              ])


              if check.returncode != 0:

                  print()
                  print("AI PATCH FAILED VALIDATION")
                  print(check.stdout[-12000:])

                  previous_log = (
                      "The previous AI-generated patch failed "
                      "git apply validation.\n\n"
                      "git apply output:\n\n"
                      + check.stdout[-12000:]
                      + "\n\n"
                      "Generate a NEW valid unified diff. "
                      "Do not repeat the malformed patch."
                  )

                  continue


              # ======================================================
              # Apply patch
              # ======================================================

              apply_result = run([
                  "git",
                  "apply",
                  "--whitespace=fix",
                  "--recount",
                  patch_file
              ])


              if apply_result.returncode != 0:

                  print()
                  print("AI PATCH COULD NOT BE APPLIED")
                  print(apply_result.stdout[-12000:])

                  previous_log = (
                      "The generated patch passed validation but "
                      "could not be applied.\n\n"
                      + apply_result.stdout[-12000:]
                  )

                  continue


              # ======================================================
              # Protect workflow files
              # ======================================================

              workflow_changes = run([
                  "git",
                  "diff",
                  "--name-only",
                  "--",
                  ".github/workflows"
              ]).stdout.strip()


              if workflow_changes:

                  print(
                      "AI attempted to modify workflow files."
                  )

                  run([
                      "git",
                      "restore",
                      "--",
                      ".github/workflows"
                  ])


              # ======================================================
              # Protect Gradle wrapper
              # ======================================================

              wrapper_changes = run([
                  "git",
                  "diff",
                  "--name-only",
                  "--",
                  "gradle/wrapper"
              ]).stdout.strip()


              if wrapper_changes:

                  print(
                      "AI attempted to modify Gradle wrapper."
                  )

                  run([
                      "git",
                      "restore",
                      "--",
                      "gradle/wrapper"
                  ])


              # ======================================================
              # Protect .gitignore
              # ======================================================

              gitignore_changes = run([
                  "git",
                  "diff",
                  "--name-only",
                  "--",
                  ".gitignore"
              ]).stdout.strip()


              if gitignore_changes:

                  print(
                      "AI attempted to modify .gitignore."
                  )

                  run([
                      "git",
                      "restore",
                      "--",
                      ".gitignore"
                  ])


              print()
              print("Current changes:")
              print(
                  run([
                      "git",
                      "status",
                      "--short"
                  ]).stdout
              )


              # ======================================================
              # Build after AI change
              # ======================================================

              build = run([
                  "bash",
                  "-lc",
                  "./gradlew build --stacktrace"
              ])


              with open(
                  "/tmp/gradle-build.log",
                  "w",
                  encoding="utf-8"
              ) as f:

                  f.write(build.stdout)


              print()
              print(
                  build.stdout[-30000:]
              )


              # ======================================================
              # Build passed
              # ======================================================

              if build.returncode == 0:

                  print()
                  print("=" * 60)
                  print("BUILD PASSED")
                  print("=" * 60)

                  break


              # ======================================================
              # Build failed
              # ======================================================

              print()
              print(
                  "BUILD FAILED - sending error back to AI."
              )

              previous_log = build.stdout

          else:

              print()
              print("=" * 60)
              print("MAXIMUM AI ATTEMPTS EXHAUSTED")
              print("=" * 60)

          PY

      # ============================================================
      # Final build
      # ============================================================

      - name: Final verification build
        id: final_build
        shell: bash
        run: |
          set -o pipefail

          ./gradlew build --stacktrace 2>&1 |
            tee /tmp/final-build.log

          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # ============================================================
      # Check protected files
      # ============================================================

      - name: Verify protected files
        shell: bash
        run: |
          set -euo pipefail

          echo "Changed files:"
          git status --short

          forbidden="$(
            git diff --name-only -- \
              '.github/workflows' \
              'gradle/wrapper' \
              '.gitignore'
          )"

          if [[ -n "${forbidden// }" ]]; then
            echo "::error::Protected files were modified:"
            echo "$forbidden"
            exit 1
          fi

      # ============================================================
      # Show final diff
      # ============================================================

      - name: Show final changes
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "FINAL BRANCH"
          echo "=========================================="

          git branch --show-current

          echo ""
          echo "=========================================="
          echo "CHANGED FILES"
          echo "=========================================="

          git status --short

          echo ""
          echo "=========================================="
          echo "DIFF STAT"
          echo "=========================================="

          git diff --stat

      # ============================================================
      # Commit
      # ============================================================

      - name: Commit successful AI changes
        if: steps.final_build.outputs.exit_code == '0'
        shell: bash
        run: |
          set -euo pipefail

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "feat: upgrade Hydraulic for Minecraft 26.2"

      # ============================================================
      # Push same AI branch
      # ============================================================

      - name: Push AI branch
        if: steps.final_build.outputs.exit_code == '0'
        shell: bash
        run: |
          set -euo pipefail

          echo "Pushing branch:"
          echo "$BRANCH"

          git push \
            --set-upstream \
            origin \
            "$BRANCH"

      # ============================================================
      # Upload logs
      # ============================================================

      - name: Upload AI build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hydraulic-ai-build-logs
          path: |
            /tmp/initial-build.log
            /tmp/gradle-build.log
            /tmp/final-build.log
          if-no-files-found: ignore

      # ============================================================
      # Fail workflow if final build failed
      # ============================================================

      - name: Fail if final build failed
        if: steps.final_build.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "::error::Final build failed."
          echo "AI changes were NOT pushed."
          exit 1
