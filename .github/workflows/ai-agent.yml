name: AI Developer Agent - Minecraft 26.2

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task for the AI developer"
        required: true
        default: |
          Upgrade Hydraulic to Minecraft 26.2.

          This is a real compatibility upgrade, not a metadata-only version change.

          The final runtime must actually load Minecraft 26.2.
          Do not stop at BUILD SUCCESSFUL if runtime still loads 26.1.x.

          Update all required Minecraft, Fabric, NeoForge, Loom and Geyser
          compatibility components as actually required by the source tree.

          Preserve existing functionality.
          Preserve Fabric/NeoForge separation.
          Preserve Geyser/Bedrock compatibility.
          Fix deprecated or incompatible APIs caused by the upgrade.
          Do not hide errors or remove functionality just to make the build pass.

          Analyze the repository first.
          Determine which Gradle project/task owns each required change.
          Add or modify the appropriate task/configuration instead of blindly
          replacing version strings throughout the repository.

          Build the appropriate modules.
          Run runtime/datagen verification.
          If anything fails, diagnose the actual root cause and continue fixing it.

          The work is not complete until the repository genuinely supports
          Minecraft 26.2 and the runtime verification proves it.

      max_attempts:
        description: "Maximum AI repair attempts"
        required: false
        default: "15"

      branch:
        description: "AI development branch"
        required: false
        default: "ai/minecraft-26.2-geyser"

permissions:
  contents: write

concurrency:
  group: ai-developer-${{ github.repository }}-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  ai-developer:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      TARGET_MINECRAFT_VERSION: "26.2"
      TARGET_JAVA_VERSION: "25"

      # ----------------------------------------------------------------
      # Model selection
      # ----------------------------------------------------------------
      # Primary model: pick a frontier, reasoning-capable coding model.
      # gpt-4.1-mini is far too weak for a real multi-module Gradle/Loom
      # compatibility migration. As of Aug 2026, strong candidates on
      # OpenRouter include anthropic/claude-opus-4.8, openai/gpt-5.6,
      # x-ai/grok-4.6, deepseek/deepseek-v4-pro and z-ai/glm-5.2 — model
      # slugs change often, so verify the exact current slug at
      # https://openrouter.ai/models?order=top-weekly before relying on
      # this default. Prefer overriding via the repo variable AI_MODEL
      # instead of editing this file.
      AI_MODEL: ${{ vars.AI_MODEL || 'anthropic/claude-opus-4.8' }}

      # Escalation model: used once the primary model has failed
      # ESCALATE_AFTER attempts in a row. Pick a model from a different
      # lab/architecture so it isn't prone to the same blind spots.
      # Leave empty to disable escalation.
      AI_MODEL_FALLBACK: ${{ vars.AI_MODEL_FALLBACK || 'openai/gpt-5.6' }}
      ESCALATE_AFTER: ${{ vars.ESCALATE_AFTER || '3' }}

      # Reasoning effort passed through to models that support extended
      # thinking (OpenRouter's unified reasoning.effort field). Models
      # that don't support it simply ignore it; set to "none" to disable.
      AI_REASONING_EFFORT: ${{ vars.AI_REASONING_EFFORT || 'high' }}

      MAX_ATTEMPTS: ${{ inputs.max_attempts || '15' }}
      TASK: ${{ inputs.task }}
      AI_BRANCH: ${{ inputs.branch }}

      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      # ----------------------------------------------------------------
      # AI context limits
      # ----------------------------------------------------------------
      # Raised to match the larger context windows of current frontier
      # models. These are character budgets, not token budgets, so they
      # still sit comfortably inside real model limits.
      MAX_CONTEXT_CHARS: "160000"
      MAX_LOG_CHARS: "45000"
      MAX_DIFF_CHARS: "30000"
      MAX_RESPONSE_TOKENS: "32000"

      # Extra budget reserved for the real source of files that were
      # actually referenced by the latest compiler/build error, so the
      # model fixes root causes instead of guessing from config files
      # alone. See extract_error_context() below.
      MAX_ERROR_CONTEXT_CHARS: "60000"

      # Hard safety limits
      MAX_PATCH_FILES: "60"
      MAX_PATCH_LINES: "4000"

    steps:

      # ============================================================
      # Validate API key
      # ============================================================

      - name: Validate OpenRouter API key
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${OPENROUTER_API_KEY:-}" ]]; then
            echo "::error::Missing OPENROUTER_API_KEY."
            exit 1
          fi

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # Git
      # ============================================================

      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "AI Developer Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch --all --prune

      # ============================================================
      # Branch
      # ============================================================

      - name: Find or create AI branch
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="${AI_BRANCH}"

          echo "=========================================="
          echo "AI BRANCH"
          echo "=========================================="
          echo "$BRANCH"

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Remote branch exists."

            git fetch origin "$BRANCH:$BRANCH"

            git switch "$BRANCH"

            # Make sure the local branch knows its remote.
            git branch --set-upstream-to="origin/$BRANCH" "$BRANCH" || true

          else
            echo "Creating new branch."

            git switch -c "$BRANCH"
          fi

          echo "AI_BRANCH=$BRANCH" >> "$GITHUB_ENV"

          echo ""
          echo "Current branch:"
          git branch --show-current

          echo ""
          echo "Current commit:"
          git rev-parse HEAD

      # ============================================================
      # Java 25
      # ============================================================

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      # ============================================================
      # Gradle preparation
      # ============================================================

      - name: Prepare Gradle
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew --version

      # ============================================================
      # Repository discovery
      # ============================================================

      - name: Discover Gradle project
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "GRADLE PROJECTS"
          echo "=========================================="

          ./gradlew projects --no-daemon

          echo ""
          echo "=========================================="
          echo "AVAILABLE TASKS"
          echo "=========================================="

          ./gradlew tasks --all --no-daemon \
            | tee /tmp/gradle-tasks.log

      # ============================================================
      # Initial build
      # ============================================================

      - name: Initial build
        id: initial_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail

          ./gradlew build \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            2>&1 | tee /tmp/initial-build.log

          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # ============================================================
      # AI Developer
      # ============================================================

      - name: AI developer loop
        shell: bash
        run: |

          set -euo pipefail

          python3 <<'PY'

          import json
          import os
          import re
          import subprocess
          import textwrap
          import time
          import urllib.request
          import urllib.error
          from pathlib import Path


          ROOT = Path.cwd()

          API_KEY = os.environ["OPENROUTER_API_KEY"]
          MODEL = os.environ["AI_MODEL"]
          MODEL_FALLBACK = os.environ.get("AI_MODEL_FALLBACK", "").strip()
          ESCALATE_AFTER = int(os.environ.get("ESCALATE_AFTER", "3"))
          REASONING_EFFORT = os.environ.get("AI_REASONING_EFFORT", "high").strip()

          PRIMARY_TEMPERATURE = 0.05
          FALLBACK_TEMPERATURE = 0.2

          TASK = os.environ["TASK"]

          TARGET_MC = os.environ["TARGET_MINECRAFT_VERSION"]
          TARGET_JAVA = os.environ["TARGET_JAVA_VERSION"]

          MAX_ATTEMPTS = int(os.environ["MAX_ATTEMPTS"])

          MAX_CONTEXT_CHARS = int(os.environ["MAX_CONTEXT_CHARS"])
          MAX_LOG_CHARS = int(os.environ["MAX_LOG_CHARS"])
          MAX_DIFF_CHARS = int(os.environ["MAX_DIFF_CHARS"])
          MAX_RESPONSE_TOKENS = int(os.environ["MAX_RESPONSE_TOKENS"])
          MAX_ERROR_CONTEXT_CHARS = int(os.environ["MAX_ERROR_CONTEXT_CHARS"])

          MAX_PATCH_FILES = int(os.environ["MAX_PATCH_FILES"])
          MAX_PATCH_LINES = int(os.environ["MAX_PATCH_LINES"])

          BRANCH = os.environ["AI_BRANCH"]


          IGNORED_DIRS = {
              ".git",
              ".gradle",
              "build",
              "node_modules",
              ".venv",
              "__pycache__",
              ".idea",
              ".vscode"
          }


          ALLOWED_SUFFIXES = {
              ".java",
              ".kt",
              ".kts",
              ".groovy",
              ".gradle",
              ".properties",
              ".toml",
              ".json",
              ".xml",
              ".yaml",
              ".yml",
              ".md",
              ".txt"
          }


          PROTECTED_PATHS = [
              ".github/workflows/",
              "gradle/wrapper/",
              ".gitignore"
          ]


          def run(cmd, check=False):

              return subprocess.run(
                  cmd,
                  cwd=ROOT,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  check=check
              )


          def git_status():

              return run([
                  "git",
                  "status",
                  "--short"
              ]).stdout


          def collect_files():

              result = run(["git", "ls-files"])

              files = []

              for rel in result.stdout.splitlines():

                  rel = rel.strip()

                  if not rel:
                      continue

                  parts = rel.split("/")

                  if any(
                      part in IGNORED_DIRS
                      for part in parts
                  ):
                      continue

                  path = ROOT / rel

                  if not path.is_file():
                      continue

                  try:
                      size = path.stat().st_size
                  except OSError:
                      continue

                  if size > 200000:
                      continue

                  suffix = path.suffix.lower()

                  if suffix in ALLOWED_SUFFIXES:
                      files.append(rel)

              return files


          def collect_version_evidence():

              candidates = [
                  "gradle.properties",
                  "build.gradle",
                  "build.gradle.kts",
                  "settings.gradle",
                  "settings.gradle.kts",
                  "gradle/libs.versions.toml",
                  "fabric/build.gradle",
                  "fabric/build.gradle.kts",
                  "shared/build.gradle",
                  "shared/build.gradle.kts",
                  "neoforge/build.gradle",
                  "neoforge/build.gradle.kts",
                  "fabric/src/main/resources/fabric.mod.json",
                  "neoforge/src/main/resources/META-INF/neoforge.mods.toml"
              ]

              chunks = []

              for rel in candidates:

                  path = ROOT / rel

                  if not path.exists():
                      continue

                  try:
                      text = path.read_text(
                          encoding="utf-8",
                          errors="replace"
                      )
                  except Exception:
                      continue

                  chunks.append(
                      f"\n===== VERSION FILE: {rel} =====\n{text}\n"
                  )

              return "".join(chunks)


          def project_context(files):

              priority = [
                  "gradle.properties",
                  "build.gradle",
                  "build.gradle.kts",
                  "settings.gradle",
                  "settings.gradle.kts",
                  "gradle/libs.versions.toml",

                  "build-logic/src/main/kotlin",
                  "fabric/build.gradle",
                  "fabric/build.gradle.kts",
                  "shared/build.gradle",
                  "shared/build.gradle.kts",
                  "neoforge/build.gradle",
                  "neoforge/build.gradle.kts",

                  "fabric/src/main/resources/fabric.mod.json",
                  "neoforge/src/main/resources/META-INF/neoforge.mods.toml"
              ]

              ordered = []

              for item in priority:

                  if item in files and item not in ordered:
                      ordered.append(item)

              for item in files:

                  if item not in ordered:
                      ordered.append(item)

              chunks = []
              total = 0

              for rel in ordered:

                  path = ROOT / rel

                  try:
                      text = path.read_text(
                          encoding="utf-8",
                          errors="replace"
                      )
                  except Exception:
                      continue

                  piece = (
                      f"\n===== FILE: {rel} =====\n"
                      f"{text}\n"
                  )

                  if total + len(piece) > MAX_CONTEXT_CHARS:
                      break

                  chunks.append(piece)
                  total += len(piece)

              return "".join(chunks)


          def extract_error_context(log, known_files, budget):

              # Scan a build/compiler log for concrete file references and
              # pull the real current source of those files into context.
              # This is what actually lets the model fix a root-cause
              # compile error instead of guessing from build-file metadata
              # alone.

              if not log:
                  return ""

              pattern = re.compile(
                  r"([\w./-]+\.(?:java|kt|kts|groovy|gradle))(?::(\d+))?"
              )

              hits = []
              seen = set()

              for match in pattern.finditer(log):

                  rel = match.group(1).lstrip("./")

                  candidates = [
                      f for f in known_files
                      if f == rel or f.endswith("/" + rel)
                  ]

                  if not candidates:
                      continue

                  resolved = candidates[0]

                  if resolved in seen:
                      continue

                  seen.add(resolved)
                  hits.append(resolved)

              chunks = []
              total = 0

              for rel in hits:

                  path = ROOT / rel

                  try:
                      text = path.read_text(
                          encoding="utf-8",
                          errors="replace"
                      )
                  except Exception:
                      continue

                  piece = (
                      f"\n===== ERROR-REFERENCED FILE: {rel} =====\n"
                      f"{text}\n"
                  )

                  if total + len(piece) > budget:
                      break

                  chunks.append(piece)
                  total += len(piece)

              return "".join(chunks)


          def current_diff():

              result = run([
                  "git",
                  "diff",
                  "--",
                  ".",
                  ":(exclude).github/workflows"
              ])

              return result.stdout[-MAX_DIFF_CHARS:]


          def diff_stats():

              result = run([
                  "git",
                  "diff",
                  "--numstat",
                  "--",
                  ".",
                  ":(exclude).github/workflows"
              ])

              files = 0
              lines = 0

              for row in result.stdout.splitlines():

                  parts = row.split("\t")

                  if len(parts) < 3:
                      continue

                  try:
                      added = int(parts[0])
                      removed = int(parts[1])
                  except ValueError:
                      continue

                  files += 1
                  lines += added + removed

              return files, lines


          def validate_protected_files():

              result = run([
                  "git",
                  "diff",
                  "--name-only"
              ])

              changed = result.stdout.splitlines()

              forbidden = []

              for path in changed:

                  for protected in PROTECTED_PATHS:

                      if path == protected or path.startswith(protected):
                          forbidden.append(path)

              return sorted(set(forbidden))


          def validate_patch_size():

              files, lines = diff_stats()

              if files > MAX_PATCH_FILES:
                  return False, (
                      f"Patch touches {files} files. "
                      f"Maximum is {MAX_PATCH_FILES}."
                  )

              if lines > MAX_PATCH_LINES:
                  return False, (
                      f"Patch changes {lines} lines. "
                      f"Maximum is {MAX_PATCH_LINES}."
                  )

              return True, ""


          SYSTEM_PROMPT = textwrap.dedent(
              f"""
              You are a senior Minecraft platform engineer
              operating as an autonomous repository repair agent.

              Target Minecraft version:
              {TARGET_MC}

              Target Java:
              {TARGET_JAVA}

              You are NOT a text replacement bot.

              You must reason about the actual Gradle project,
              source code, mappings, loader APIs, dependencies,
              runtime configuration and module ownership.

              The repository must genuinely support Minecraft
              {TARGET_MC}.

              A successful Gradle build is NOT sufficient.

              Runtime verification must actually load:
              Minecraft {TARGET_MC}

              Never claim success when runtime loads an older
              Minecraft version.

              Each prompt may include an ATTEMPT HISTORY section listing
              what previous attempts tried and why they failed, and an
              ERROR-REFERENCED FILES section with the real current source
              of every file named in the latest build error. Use both:
              do not repeat an approach already marked as failed, and fix
              the actual file and line the error points to instead of
              guessing.

              Runtime verification may run more than one Gradle task (for
              example separate Fabric, NeoForge and datagen tasks). All of
              them must load the target Minecraft version for an attempt
              to count as verified.

              NEVER use workarounds whose purpose is to make
              the build appear successful without real
              compatibility.

              Do not:
              - suppress compilation errors
              - disable tests
              - skip required tasks
              - remove functionality just to compile
              - downgrade Minecraft to an older version
              - fake runtime output
              - modify logs to fake success
              - blindly replace version strings
              - remove dependencies merely to avoid errors
              - disable Fabric/NeoForge functionality
              - bypass Geyser compatibility
              - change unrelated code

              Determine which Gradle module owns each change.

              If a task belongs to a specific module, make the
              appropriate change in that module/configuration.

              Fabric and NeoForge must remain properly separated.

              Geyser integration must remain functional.

              Prefer real dependency/API migration over metadata
              changes.

              Return ONLY a unified git diff.

              The response MUST start with:

              diff --git

              Do not return Markdown.
              Do not use code fences.
              Do not return explanations.
              Do not return analysis.
              Do not return JSON.

              Never modify:
              .github/workflows/
              gradle/wrapper/
              .gitignore

              Never commit.
              Never push.

              Your patch must be directly usable by:

              git apply
              """
          )


          def _post_openrouter(payload, retries=3):

              # Retries transient failures (rate limits, upstream 5xx)
              # with exponential backoff instead of burning an entire
              # attempt on a blip.

              request_body = json.dumps(payload).encode("utf-8")

              last_error = None

              for i in range(retries):

                  request = urllib.request.Request(
                      "https://openrouter.ai/api/v1/chat/completions",
                      data=request_body,
                      headers={
                          "Authorization": f"Bearer {API_KEY}",
                          "Content-Type": "application/json",
                          "HTTP-Referer":
                              f"https://github.com/"
                              f"{os.environ['GITHUB_REPOSITORY']}",
                          "X-Title":
                              "Hydraulic Long-Term AI Developer"
                      },
                      method="POST"
                  )

                  try:

                      with urllib.request.urlopen(
                          request,
                          timeout=600
                      ) as response:

                          return json.load(response)

                  except urllib.error.HTTPError as e:

                      body = e.read().decode(errors="replace")

                      last_error = RuntimeError(
                          f"OpenRouter HTTP {e.code}: {body[:8000]}"
                      )

                      transient = e.code in (429, 500, 502, 503, 504)

                      if transient and i < retries - 1:

                          sleep_for = 5 * (2 ** i)

                          print(
                              f"Transient OpenRouter error {e.code}, "
                              f"retrying in {sleep_for}s..."
                          )

                          time.sleep(sleep_for)

                          continue

                      raise last_error

                  except urllib.error.URLError as e:

                      last_error = RuntimeError(
                          f"OpenRouter connection error: {e}"
                      )

                      if i < retries - 1:

                          sleep_for = 5 * (2 ** i)

                          print(
                              f"Connection error, retrying in "
                              f"{sleep_for}s..."
                          )

                          time.sleep(sleep_for)

                          continue

                      raise last_error

              raise last_error


          def call_ai(prompt, model, temperature):

              payload = {

                  "model": model,

                  "messages": [

                      {
                          "role": "system",
                          "content": SYSTEM_PROMPT
                      },

                      {
                          "role": "user",
                          "content": prompt
                      }

                  ],

                  "temperature": temperature,

                  "max_tokens": MAX_RESPONSE_TOKENS
              }

              if REASONING_EFFORT and REASONING_EFFORT.lower() != "none":
                  payload["reasoning"] = {"effort": REASONING_EFFORT}

              try:

                  data = _post_openrouter(payload)

              except RuntimeError as exc:

                  if "reasoning" in payload and "HTTP 400" in str(exc):

                      print(
                          "Model rejected the 'reasoning' parameter, "
                          "retrying without it."
                      )

                      payload.pop("reasoning", None)

                      data = _post_openrouter(payload)

                  else:

                      raise

              if "choices" not in data:
                  raise RuntimeError(
                      "Invalid OpenRouter response:\n"
                      + json.dumps(data, indent=2)[:8000]
                  )

              content = data["choices"][0]["message"]["content"]

              return content or ""


          def extract_patch(response):

              if not response:
                  return ""

              response = response.strip()

              response = re.sub(
                  r"^```(?:diff|patch)?\s*",
                  "",
                  response,
                  flags=re.IGNORECASE
              )

              response = re.sub(
                  r"\s*```\s*$",
                  "",
                  response
              )

              start = response.find("diff --git")

              if start < 0:
                  return ""

              patch = response[start:]

              fence = patch.find("\n```")

              if fence >= 0:
                  patch = patch[:fence]

              return patch.rstrip()


          def target_static_check():

              evidence = collect_version_evidence()

              old_hits = re.findall(
                  r"\b26\.1(?:\.\d+)?\b",
                  evidence
              )

              target_hits = re.findall(
                  r"\b26\.2(?:\.\d+)?\b",
                  evidence
              )

              return {
                  "target_hits": len(target_hits),
                  "old_hits": len(old_hits),
                  "evidence": evidence[-12000:]
              }


          def discover_verification_tasks():

              # Use the task list captured by the earlier "Discover Gradle
              # project" step to find every datagen/run task that can
              # actually prove runtime compatibility, instead of trusting
              # a single hardcoded task name. This is what lets a single
              # verification pass genuinely cover Fabric, NeoForge and
              # Geyser-adjacent modules separately.

              tasks_log = Path("/tmp/gradle-tasks.log")

              if not tasks_log.exists():
                  return [":test:runDatagen"]

              text = tasks_log.read_text(
                  encoding="utf-8",
                  errors="replace"
              )

              found = re.findall(
                  r"^(:[\w:-]*(?:runDatagen|runClient|runServer))\b",
                  text,
                  flags=re.MULTILINE
              )

              ordered = []

              for task in found:

                  if task not in ordered:
                      ordered.append(task)

              if (
                  ":test:runDatagen" not in ordered
                  and (ROOT / "test").exists()
              ):
                  ordered.insert(0, ":test:runDatagen")

              return ordered or [":test:runDatagen"]


          def runtime_verify():

              tasks = discover_verification_tasks()

              combined_output = []
              reasons = []
              all_ok = True

              for task in tasks:

                  cmd = [
                      "./gradlew",
                      task,
                      "--no-daemon",
                      "--stacktrace"
                  ]

                  result = subprocess.run(
                      cmd,
                      cwd=ROOT,
                      text=True,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT
                  )

                  output = result.stdout

                  combined_output.append(
                      f"\n===== TASK: {task} =====\n{output}\n"
                  )

                  loaded_target = bool(
                      re.search(
                          rf"Loading Minecraft {re.escape(TARGET_MC)}"
                          rf"(?:\b|[.\s])",
                          output
                      )
                  )

                  loaded_old = bool(
                      re.search(
                          r"Loading Minecraft 26\.1(?:\.\d+)?",
                          output
                      )
                  )

                  mappings_missing = "Mappings not present!" in output

                  if loaded_old:
                      all_ok = False
                      reasons.append(
                          f"{task}: still loaded Minecraft 26.1.x."
                      )

                  elif not loaded_target:
                      all_ok = False
                      reasons.append(
                          f"{task}: did not prove Minecraft {TARGET_MC}."
                      )

                  elif mappings_missing:
                      all_ok = False
                      reasons.append(
                          f"{task}: reports 'Mappings not present!'."
                      )

                  elif result.returncode != 0:
                      all_ok = False
                      reasons.append(
                          f"{task}: task failed "
                          f"(exit {result.returncode})."
                      )

              full_output = "".join(combined_output)

              Path("/tmp/runtime-26.2.log").write_text(
                  full_output,
                  encoding="utf-8"
              )

              if not tasks:
                  return (
                      False,
                      "No runtime/datagen verification task was found.",
                      full_output
                  )

              if all_ok:
                  return (
                      True,
                      "Runtime target verified across: "
                      + ", ".join(tasks),
                      full_output
                  )

              return False, "; ".join(reasons), full_output


          if Path("/tmp/initial-build.log").exists():

              previous_log = Path(
                  "/tmp/initial-build.log"
              ).read_text(
                  encoding="utf-8",
                  errors="replace"
              )

          else:

              previous_log = ""


          success = False
          consecutive_failures = 0
          attempt_history = []


          for attempt in range(1, MAX_ATTEMPTS + 1):

              print()
              print("=" * 70)
              print(
                  f"AI REPAIR ATTEMPT "
                  f"{attempt}/{MAX_ATTEMPTS}"
              )
              print("=" * 70)


              if consecutive_failures >= ESCALATE_AFTER and MODEL_FALLBACK:

                  active_model = MODEL_FALLBACK
                  active_temperature = FALLBACK_TEMPERATURE

                  print(f"Escalating to fallback model: {active_model}")

              else:

                  active_model = MODEL
                  active_temperature = PRIMARY_TEMPERATURE

              print(
                  f"Using model: {active_model} "
                  f"(temperature={active_temperature})"
              )


              files = collect_files()

              static = target_static_check()

              context = project_context(files)

              error_context = extract_error_context(
                  previous_log, files, MAX_ERROR_CONTEXT_CHARS
              )

              diff = current_diff()

              status = git_status()

              history_block = "\n".join(
                  f"- Attempt {i + 1}: {note}"
                  for i, note in enumerate(attempt_history)
              ) or "(no previous attempts yet)"


              prompt = textwrap.dedent(
                  f"""
                  Repository:
                  {os.environ['GITHUB_REPOSITORY']}

                  Branch:
                  {BRANCH}

                  Target:
                  Minecraft {TARGET_MC}
                  Java {TARGET_JAVA}

                  Main task:
                  {TASK}

                  Attempt:
                  {attempt}/{MAX_ATTEMPTS}


                  =========================================================
                  ATTEMPT HISTORY (what has already been tried)
                  =========================================================

                  {history_block}

                  Do not repeat an approach already listed above as failed
                  unless you have a genuinely new reason to believe it will
                  work now.


                  =========================================================
                  REQUIRED GRADLE VALIDATION TASKS
                  =========================================================

                  The repository must be treated as a multi-module project.

                  Identify and use the correct task for each module.

                  At minimum, inspect these when they exist:

                  :shared:build
                  :fabric:build
                  :test:build

                  Runtime verification will automatically run every
                  run/runDatagen-style task discovered in the project
                  (Fabric, NeoForge, datagen, etc.) — make sure each such
                  task actually exists and works for {TARGET_MC}. Do not
                  remove or rename a task just because it is inconvenient.

                  Do NOT remove a task merely because it currently passes
                  or because another task already depends on it.

                  If the project exposes a more appropriate task for a
                  particular module, use that task instead.


                  =========================================================
                  TARGET REQUIREMENT
                  =========================================================

                  Required Minecraft:
                  {TARGET_MC}

                  Static target references:
                  {static["target_hits"]}

                  Remaining 26.1 references:
                  {static["old_hits"]}

                  The following is evidence only.
                  Do not assume it is correct:

                  {static["evidence"]}


                  =========================================================
                  CURRENT STATUS
                  =========================================================

                  {status}


                  =========================================================
                  CURRENT BUILD LOG
                  =========================================================

                  {previous_log[-MAX_LOG_CHARS:]}


                  =========================================================
                  REAL SOURCE OF FILES REFERENCED BY THE ERRORS ABOVE
                  =========================================================

                  This is the actual current content of every file that
                  appeared in a compiler/build error above. Fix the real
                  root cause in these files rather than guessing.

                  {error_context or "(no specific files were referenced by the log above)"}


                  =========================================================
                  CURRENT DIFF
                  =========================================================

                  {diff}


                  =========================================================
                  REPOSITORY
                  =========================================================

                  {context}


                  =========================================================
                  REQUIRED BEHAVIOR
                  =========================================================

                  1. Analyze the repository.

                  2. Determine the real cause of any incompatibility.

                  3. Determine which Gradle task/module owns the change.

                  4. Make a real source/dependency/build configuration change.

                  5. Preserve existing functionality.

                  6. Preserve Fabric and NeoForge support.

                  7. Preserve Geyser integration.

                  8. Do not merely replace "26.1.2" with "26.2".

                  9. Do not stop because Gradle currently passes.

                  10. If runtime still loads 26.1.x, the task is NOT complete.

                  11. If mappings are unavailable because the project is still
                      configured for the old Minecraft version, fix the actual
                      Loom/mapping/dependency configuration.

                  12. Do not fake, suppress or bypass validation.

                  13. Do not remove tests/tasks to make CI green.

                  14. Do not perform unrelated refactoring.

                  15. Keep the patch focused.

                  16. Check the ATTEMPT HISTORY above; do not retry an
                      approach already marked as failed without a real
                      reason to expect a different result this time.

                  17. Prioritize fixing the files listed under REAL SOURCE
                      OF FILES REFERENCED BY THE ERRORS ABOVE when present.

                  18. Return ONLY a valid unified git diff.

                  The first line MUST be:

                  diff --git
                  """
              )


              try:

                  response = call_ai(prompt, active_model, active_temperature)

              except Exception as exc:

                  previous_log = (
                      "AI REQUEST ERROR:\n"
                      + str(exc)
                  )

                  print(previous_log)

                  attempt_history.append(
                      f"AI request error ({active_model}): "
                      f"{str(exc)[:150]}"
                  )

                  consecutive_failures += 1

                  continue


              patch = extract_patch(response)


              if not patch:

                  previous_log = (
                      "AI returned no valid unified diff.\n"
                      "Return ONLY a unified git diff beginning with "
                      "'diff --git'."
                  )

                  print(previous_log)

                  attempt_history.append(
                      f"{active_model} returned no valid diff."
                  )

                  consecutive_failures += 1

                  continue


              patch_file = Path("/tmp/ai.patch")

              patch_file.write_text(
                  patch + "\n",
                  encoding="utf-8"
              )


              def try_apply(pf):

                  # Try a normal apply first; fall back to a 3-way merge,
                  # which can still succeed when context lines have
                  # drifted slightly but the base blobs are still known.

                  normal_check = run([
                      "git", "apply", "--check", "--recount", str(pf)
                  ])

                  if normal_check.returncode == 0:

                      result = run([
                          "git", "apply", "--whitespace=fix",
                          "--recount", str(pf)
                      ])

                      return result, normal_check

                  threeway_check = run([
                      "git", "apply", "--check", "--3way",
                      "--recount", str(pf)
                  ])

                  if threeway_check.returncode == 0:

                      result = run([
                          "git", "apply", "--3way", "--whitespace=fix",
                          "--recount", str(pf)
                      ])

                      return result, threeway_check

                  return None, normal_check


              apply_result, check_result = try_apply(patch_file)


              if apply_result is None:

                  previous_log = (
                      "PATCH VALIDATION FAILED (normal and 3-way):\n\n"
                      + check_result.stdout[-MAX_LOG_CHARS:]
                  )

                  print(previous_log)

                  attempt_history.append(
                      "Patch failed git apply --check (normal + 3-way)."
                  )

                  consecutive_failures += 1

                  continue


              if apply_result.returncode != 0:

                  previous_log = (
                      "PATCH APPLY FAILED:\n\n"
                      + apply_result.stdout[-MAX_LOG_CHARS:]
                  )

                  print(previous_log)

                  attempt_history.append(
                      "Patch passed --check but the apply command "
                      "still failed."
                  )

                  consecutive_failures += 1

                  continue


              forbidden = validate_protected_files()


              if forbidden:

                  print()
                  print(
                      "AI attempted to modify protected files:"
                  )

                  print("\n".join(forbidden))

                  for path in forbidden:

                      run([
                          "git",
                          "restore",
                          "--",
                          path
                      ])

                  previous_log = (
                      "The previous patch attempted to modify protected "
                      "files. Those changes were rejected.\n\n"
                      + "\n".join(forbidden)
                  )

                  attempt_history.append(
                      "Patch touched protected files: "
                      + ", ".join(forbidden)
                  )

                  consecutive_failures += 1

                  continue


              valid_size, size_error = validate_patch_size()


              if not valid_size:

                  print(size_error)

                  run([
                      "git",
                      "reset",
                      "--hard",
                      "HEAD"
                  ])

                  previous_log = (
                      "Patch exceeded safety limits.\n"
                      + size_error
                      + "\nGenerate a smaller focused patch."
                  )

                  attempt_history.append(
                      "Patch exceeded size limits: " + size_error
                  )

                  consecutive_failures += 1

                  continue


              print()
              print("==========================================")
              print("PATCH APPLIED")
              print("==========================================")

              print(git_status())


              # --------------------------------------------------------
              # Build actual project tasks
              # --------------------------------------------------------

              task_result = run([
                  "bash",
                  "-lc",
                  """
                  set -o pipefail

                  ./gradlew \
                    :shared:build \
                    :fabric:build \
                    :test:build \
                    --no-daemon \
                    --stacktrace \
                    --warning-mode all
                  """
              ])


              Path(
                  "/tmp/gradle-build.log"
              ).write_text(
                  task_result.stdout,
                  encoding="utf-8"
              )


              print(
                  task_result.stdout[-MAX_LOG_CHARS:]
              )


              if task_result.returncode != 0:

                  previous_log = (
                      "MODULE BUILD FAILED:\n\n"
                      + task_result.stdout[-MAX_LOG_CHARS:]
                  )

                  attempt_history.append(
                      "Patch applied but :shared/:fabric/:test build "
                      "failed."
                  )

                  consecutive_failures += 1

                  continue


              # --------------------------------------------------------
              # Real runtime verification
              # --------------------------------------------------------

              runtime_ok, runtime_reason, runtime_output = (
                  runtime_verify()
              )


              print()
              print("==========================================")
              print("RUNTIME VERIFICATION")
              print("==========================================")
              print(runtime_reason)


              if not runtime_ok:

                  previous_log = (
                      "RUNTIME VERIFICATION FAILED:\n\n"
                      + runtime_reason
                      + "\n\n"
                      + runtime_output[-MAX_LOG_CHARS:]
                  )

                  attempt_history.append(
                      "Build passed but runtime verification failed: "
                      + runtime_reason
                  )

                  consecutive_failures += 1

                  continue


              # --------------------------------------------------------
              # Final target verification
              # --------------------------------------------------------

              static = target_static_check()


              if static["old_hits"] > 0:

                  print(
                      "WARNING: old 26.1 references remain in "
                      "configuration evidence."
                  )

                  previous_log = (
                      "Target verification found remaining 26.1 "
                      "references in relevant configuration files.\n\n"
                      + static["evidence"]
                  )

                  attempt_history.append(
                      "Build and runtime passed but stale 26.1 "
                      "references still remain in configuration files."
                  )

                  consecutive_failures += 1

                  continue


              # --------------------------------------------------------
              # Success
              # --------------------------------------------------------

              print()
              print("=" * 70)
              print("AI TARGET VERIFIED")
              print("=" * 70)

              print(
                  f"Minecraft {TARGET_MC} runtime confirmed."
              )

              print(
                  "Required module builds passed."
              )

              success = True

              break


          Path("/tmp/attempt-history.log").write_text(
              "\n".join(
                  f"Attempt {i + 1}: {note}"
                  for i, note in enumerate(attempt_history)
              ) or "No attempts were recorded.",
              encoding="utf-8"
          )


          if not success:

              print()
              print("=" * 70)
              print("AI DEVELOPMENT FAILED")
              print("=" * 70)

              raise SystemExit(1)

          PY

      # ============================================================
      # Final independent module build
      # ============================================================

      - name: Final module build
        id: final_build
        shell: bash
        run: |
          set -o pipefail

          ./gradlew \
            :shared:build \
            :fabric:build \
            :test:build \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            2>&1 | tee /tmp/final-build.log

          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # ============================================================
      # Final independent runtime verification
      # ============================================================

      - name: Final Minecraft 26.2 runtime verification
        id: runtime_verify
        shell: bash
        run: |
          set -o pipefail

          echo "=========================================="
          echo "FINAL RUNTIME VERIFICATION"
          echo "=========================================="

          # Discover every Fabric/NeoForge/datagen-style task instead of
          # trusting a single hardcoded task, so Fabric, NeoForge and
          # Geyser-adjacent modules are all actually proven, not just one.
          mapfile -t VERIFY_TASKS < <(
            grep -oE '^:[[:alnum:]:_-]*(runDatagen|runClient|runServer)\b' \
              /tmp/gradle-tasks.log 2>/dev/null | sort -u
          )

          if [[ ${#VERIFY_TASKS[@]} -eq 0 ]]; then
            VERIFY_TASKS=(":test:runDatagen")
          fi

          echo "Verification tasks: ${VERIFY_TASKS[*]}"

          : > /tmp/final-runtime.log

          overall_status=0

          for t in "${VERIFY_TASKS[@]}"; do
            echo ""
            echo "----- Running $t -----"

            ./gradlew "$t" --no-daemon --stacktrace \
              2>&1 | tee -a /tmp/final-runtime.log

            task_status="${PIPESTATUS[0]}"

            if [[ "$task_status" -ne 0 ]]; then
              echo "::error::$t failed."
              overall_status=1
            fi
          done

          if [[ "$overall_status" -ne 0 ]]; then
            echo "::error::One or more runtime/datagen tasks failed."
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "VERIFYING ACTUAL MINECRAFT VERSION"
          echo "=========================================="

          if ! grep -Eq \
            'Loading Minecraft 26\.2([[:space:]]|$|[.])' \
            /tmp/final-runtime.log; then

            echo "::error::Runtime did not load Minecraft 26.2."
            echo ""
            echo "Observed Minecraft lines:"
            grep -E \
              'Loading Minecraft|minecraft [0-9]' \
              /tmp/final-runtime.log || true

            exit 1
          fi

          if grep -Eq \
            'Loading Minecraft 26\.1(\.[0-9]+)?' \
            /tmp/final-runtime.log; then

            echo "::error::Runtime still loaded Minecraft 26.1.x."
            exit 1
          fi

          if grep -q \
            'Mappings not present!' \
            /tmp/final-runtime.log; then

            echo "::error::Mappings are not present."
            echo "::error::This runtime is not accepted as a verified 26.2 upgrade."
            exit 1
          fi

          echo ""
          echo "Minecraft 26.2 runtime verification PASSED."

      # ============================================================
      # Final protected file validation
      # ============================================================

      - name: Verify protected files
        shell: bash
        run: |
          set -euo pipefail

          forbidden="$(
            git diff --name-only -- \
              '.github/workflows' \
              'gradle/wrapper' \
              '.gitignore'
          )"

          if [[ -n "${forbidden// }" ]]; then
            echo "::error::Protected files were modified:"
            echo "$forbidden"
            exit 1
          fi

      # ============================================================
      # Final target evidence
      # ============================================================

      - name: Verify target configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "TARGET CONFIGURATION"
          echo "=========================================="

          grep -RInE \
            '26\.2|minecraft_version|minecraft_version_range' \
            gradle.properties \
            gradle/ \
            build.gradle* \
            settings.gradle* \
            fabric/ \
            shared/ \
            neoforge/ \
            2>/dev/null \
            | head -n 300 || true

          echo ""
          echo "=========================================="
          echo "RUNTIME EVIDENCE"
          echo "=========================================="

          grep -E \
            'Loading Minecraft|fabricloader|fabric-api|minecraft [0-9]' \
            /tmp/final-runtime.log \
            || true

      # ============================================================
      # Final diff
      # ============================================================

      - name: Show final changes
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "BRANCH"
          echo "=========================================="

          git branch --show-current

          echo ""
          echo "=========================================="
          echo "STATUS"
          echo "=========================================="

          git status --short

          echo ""
          echo "=========================================="
          echo "DIFF STAT"
          echo "=========================================="

          git diff --stat

          echo ""
          echo "=========================================="
          echo "DIFF"
          echo "=========================================="

          git diff -- \
            . \
            ':(exclude).github/workflows' \
            ':(exclude)gradle/wrapper'

      # ============================================================
      # Commit
      # ============================================================

      - name: Commit verified AI changes
        if: |
          steps.final_build.outputs.exit_code == '0' &&
          steps.runtime_verify.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "feat: upgrade Hydraulic for Minecraft 26.2"

      # ============================================================
      # Push
      # ============================================================

      - name: Push verified AI branch
        if: |
          steps.final_build.outputs.exit_code == '0' &&
          steps.runtime_verify.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          git push \
            --set-upstream \
            origin \
            "$AI_BRANCH"

      # ============================================================
      # Upload logs
      # ============================================================

      - name: Upload AI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hydraulic-ai-diagnostics
          if-no-files-found: ignore
          path: |
            /tmp/initial-build.log
            /tmp/gradle-build.log
            /tmp/final-build.log
            /tmp/final-runtime.log
            /tmp/runtime-26.2.log
            /tmp/gradle-tasks.log
            /tmp/attempt-history.log

      # ============================================================
      # Final failure gate
      # ============================================================

      - name: Final failure gate
        if: |
          steps.final_build.outputs.exit_code != '0' ||
          steps.runtime_verify.outcome != 'success'
        shell: bash
        run: |
          echo "::error::Minecraft 26.2 verification failed."
          echo "::error::No unverified AI result was pushed."
          exit 1
